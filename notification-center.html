<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a14">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  connect-src 'self' https://*.supabase.co wss://*.supabase.co;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Joy Go Beta 3.0.2｜會員活動通知中心</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#061a14;
  --bg2:#0a241b;
  --card:#0d281f;
  --card2:#12352a;
  --ink:#f6f1df;
  --muted:#c7c1ad;
  --line:#2c5b49;
  --title:#143a2d;
  --field:#0a2119;
  --green:#1f7a55;
  --red:#b9473f;
  --gold:#d5ad55;
  --gold2:#f1cf78;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(circle at 85% 8%,rgba(213,173,85,.10),transparent 24%),linear-gradient(180deg,#061a14,#0a241b);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#071a14,#0b261c);color:var(--ink);padding:14px 18px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(213,173,85,.45);box-shadow:0 2px 14px #0008}
header h1{margin:0;font-size:21px;flex:1;color:var(--gold2);text-shadow:0 1px 0 #000}
header small{display:block;color:#d9d2bd;margin-top:3px}
.wrap{max-width:1100px;margin:auto;padding:16px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:15px;box-shadow:0 8px 26px #0005}
.card h2{font-size:18px;margin:0;padding:12px 15px;color:var(--gold2);background:linear-gradient(180deg,#173c2f,#102e24);border-bottom:1px solid rgba(213,173,85,.38)}
.body{padding:15px}
.notice{padding:11px 13px;border-radius:11px;background:#0e3025;border:1px solid #2f6a53;margin-bottom:13px;color:#e8eadf}
.notice.good{background:#113a2b;border-color:#2d835c;color:#c9f0d9}
.notice.bad{background:#3a1e1b;border-color:#8f4b43;color:#ffd8d2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:700;font-size:13px;margin-bottom:5px;color:#f3ead2}
input,select,textarea{width:100%;border:1px solid #356450;background:var(--field);color:var(--ink);border-radius:10px;padding:11px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(213,173,85,.15)}
textarea{min-height:120px;resize:vertical}
.full{grid-column:1/-1}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font:inherit;cursor:pointer;box-shadow:0 2px 8px #0003}
.primary{background:linear-gradient(180deg,#e5bd63,#b98022);color:#1d170c}
.secondary{background:#4f4634;color:#fff}
.gold{background:linear-gradient(180deg,#d0a847,#a4731f);color:#fff}
.ghost{background:#0a2119;color:var(--gold2);border:1px solid rgba(213,173,85,.55)}
.danger{background:var(--red);color:#fff}
.statbar{display:flex;gap:10px;flex-wrap:wrap}
.stat{padding:9px 12px;border:1px solid #356450;border-radius:999px;background:#102f25;font-size:13px;color:#e9e4d7}
.item{border:1px solid #356450;background:linear-gradient(180deg,#102f25,#0d281f);border-radius:13px;padding:13px;margin-bottom:10px}
.item.unread{border-left:5px solid var(--gold)}
.item h3{margin:0 0 6px;font-size:17px;color:var(--gold2)}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.bodytext{white-space:pre-wrap;line-height:1.55;color:#f1eee5}
.item-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#173d2f;border:1px solid #356450;color:#e6d79d;font-size:11px;margin-left:5px}
@media(max-width:760px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  header{align-items:flex-start}
  header h1{font-size:18px}
}
</style>

<style id="joygoBrightTextV2">
/* Joy Go 綠金亮字版：只強化視覺，不改任何功能邏輯 */
:root{
  --ink:#FFF8E7;
  --muted:#E3DCC8;
  --gold:#E7B94A;
  --gold2:#FFD978;
  --field:#102C22;
}
html,body{font-size:16px;line-height:1.55}
header{padding:16px 20px}
header h1{font-size:29px;font-weight:900;letter-spacing:.3px;color:var(--gold2);text-shadow:0 2px 0 #000,0 0 10px rgba(255,217,120,.12)}
header small{font-size:14px;color:#F0E7CF;font-weight:650}
.card h2{font-size:22px;font-weight:900;letter-spacing:.2px;color:var(--gold2);padding:14px 17px}
.body{font-size:16px}
label{font-size:16px;font-weight:850;color:#FFF6DC;margin-bottom:7px}
input,select,textarea{font-size:16px;font-weight:650;background:#102C22;color:#FFF9EA;border-color:#477B65;padding:12px}
input::placeholder,textarea::placeholder{color:#CFC7B5;opacity:1}
.notice{font-size:16px;font-weight:650;color:#F5F4E9}
button{font-size:16px;font-weight:900;padding:11px 17px}
.primary{background:linear-gradient(180deg,#FFD86F,#D89C25);color:#1B160B;border:1px solid #F0C85B;box-shadow:0 3px 10px #0005,inset 0 1px 0 #fff7}
.ghost{color:#FFE08B;font-weight:850}
.secondary{font-weight:850}
.stat{font-size:15px;font-weight:750;color:#FFF2D7}
.item h3{font-size:20px;font-weight:900;color:var(--gold2)}
.meta{font-size:14px;color:#E5DDC9;font-weight:600}
.bodytext{font-size:16px;color:#FFF7E8;font-weight:550}
.badge{font-size:12px;font-weight:850;color:#FFE18C}
.empty{font-size:17px;color:#EEE5D0;font-weight:600}
@media(max-width:760px){
  html,body{font-size:15px}
  header h1{font-size:22px}
  header small{font-size:13px}
  .card h2{font-size:20px}
  label,input,select,textarea,button{font-size:15px}
  .item h3{font-size:18px}
  .meta{font-size:13px}
}
</style>

</head>
<body>
<header>
  <div>
    <h1>🔔 Joy Go 會員活動通知中心</h1>
    <small>Beta 3.0.2｜站內通知＋收回／刪除＋會員 Email</small>
  </div>
  <button class="ghost" onclick="location.href='index.html'">返回平台</button>
</header>

<div class="wrap">
  <div id="status" class="notice">正在連接 Joy Go 會員系統…</div>

  <section id="adminCard" class="card hidden">
    <h2>發布活動通知</h2>
    <div class="body">
      <div class="grid">
        <div class="full">
          <label>活動標題</label>
          <input id="title" maxlength="100" placeholder="例如：第一屆 Joy Go 網路圍棋友誼賽">
        </div>
        <div>
          <label>活動日期時間</label>
          <input id="eventAt" type="datetime-local">
        </div>
        <div>
          <label>通知對象</label>
          <select id="audience">
            <option value="all">全部已註冊會員</option>
            <option value="member">正式會員</option>
            <option value="trial">試用會員</option>
          </select>
        </div>
        <div>
          <label>活動地點／方式</label>
          <input id="location" maxlength="120" placeholder="例如：Joy Go Platform 線上">
        </div>
        <div>
          <label>報名／活動連結</label>
          <input id="signupUrl" maxlength="500" placeholder="可留空">
        </div>
        <div class="full">
          <label>活動內容</label>
          <textarea id="body" maxlength="3000" placeholder="輸入活動辦法、時間、資格、獎勵與注意事項"></textarea>
        </div>
      </div>

      <div class="notice" style="margin-top:12px">
        <label style="display:flex;align-items:center;gap:9px;margin:0;cursor:pointer">
          <input id="sendEmail" type="checkbox" checked style="width:20px;height:20px">
          <span><b>同時寄送 Email</b>：寄到會員註冊信箱；Email 地址不會顯示在前端。</span>
        </label>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="publishBtn" class="primary">發布給會員</button>
        <button id="clearBtn" class="ghost">清空內容</button>
      </div>
      <div class="meta" style="margin-top:9px">
        先建立站內通知，再由 Supabase Edge Function 安全寄送 Email；寄信金鑰不會放在瀏覽器。
      </div>
    </div>
  </section>

  <section id="adminListCard" class="card hidden">
    <h2>最近發布活動</h2>
    <div class="body">
      <div id="adminStats" class="statbar"></div>
      <div id="adminList" style="margin-top:12px"></div>
    </div>
  </section>

  <section class="card">
    <h2>我的活動通知</h2>
    <div class="body">
      <div class="row" style="margin-bottom:12px">
        <div id="myStats" class="statbar" style="flex:1"></div>
        <button id="refreshBtn" class="ghost">重新整理</button>
        <button id="readAllBtn" class="secondary">全部標示已讀</button>
      </div>
      <div id="feed"><div class="empty">目前沒有活動通知。</div></div>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL="https://kpwfkmkxtrwmlxhomaxy.supabase.co";
const SUPABASE_KEY="sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});
const $=id=>document.getElementById(id);
let session=null;
let staff=false;

function setStatus(msg,type=""){
  const el=$("status");
  el.className="notice"+(type?(" "+type):"");
  el.textContent=msg;
}
function esc(s){
  return String(s??"")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function fmt(ts){
  if(!ts)return "未設定";
  try{return new Date(ts).toLocaleString("zh-TW",{hour12:false})}catch{return ts}
}
function clearForm(){
  $("title").value="";
  $("eventAt").value="";
  $("location").value="";
  $("signupUrl").value="";
  $("body").value="";
  $("audience").value="all";
}

async function init(){
  const {data,error}=await sb.auth.getSession();
  if(error){setStatus("會員服務讀取失敗："+error.message,"bad");return}
  session=data.session;
  if(!session){
    setStatus("請先回 Joy Go 平台登入會員，再進入活動通知中心。","bad");
    return;
  }

  const {data:isStaff,error:staffErr}=await sb.rpc("is_joygo_staff");
  staff=!staffErr && isStaff===true;

  if(staff){
    $("adminCard").classList.remove("hidden");
    $("adminListCard").classList.remove("hidden");
  }
  setStatus(staff?"✅ 已登入管理員活動通知中心。":"✅ 已登入會員活動通知中心。","good");

  await Promise.all([loadFeed(), staff?loadAdmin():Promise.resolve()]);
}

async function loadFeed(){
  const {data,error}=await sb.rpc("joygo_activity_my_feed",{p_limit:50});
  if(error){
    $("feed").innerHTML='<div class="empty">讀取失敗：'+esc(error.message)+'</div>';
    return;
  }
  const rows=data||[];
  const unread=rows.filter(x=>!x.read_at).length;
  $("myStats").innerHTML=
    `<div class="stat">共 ${rows.length} 則</div><div class="stat">未讀 ${unread} 則</div>`;

  if(!rows.length){
    $("feed").innerHTML='<div class="empty">目前沒有活動通知。</div>';
    return;
  }

  $("feed").innerHTML=rows.map(x=>{
    const link=x.signup_url?`<button class="gold" onclick="window.open('${esc(x.signup_url)}','_blank','noopener')">活動／報名連結</button>`:"";
    const read=x.read_at
      ? `<span class="badge">已讀</span>`
      : `<button class="primary" onclick="markRead('${x.notification_id}')">標示已讀</button>`;
    return `
      <article class="item ${x.read_at?"":"unread"}">
        <h3>${esc(x.title)} ${x.read_at?'<span class="badge">已讀</span>':'<span class="badge">未讀</span>'}</h3>
        <div class="meta">
          活動：${esc(fmt(x.event_at))}　
          地點：${esc(x.location||"未設定")}　
          發布：${esc(fmt(x.published_at))}
        </div>
        <div class="bodytext">${esc(x.body)}</div>
        <div class="item-actions">${link}${read}</div>
      </article>`;
  }).join("");
}

async function markRead(id){
  const {error}=await sb.rpc("joygo_activity_mark_read",{p_notification_id:id});
  if(error){setStatus("標示已讀失敗："+error.message,"bad");return}
  await loadFeed();
}
window.markRead=markRead;

async function markAllRead(){
  const {error}=await sb.rpc("joygo_activity_mark_all_read");
  if(error){setStatus("全部標示已讀失敗："+error.message,"bad");return}
  setStatus("✅ 已全部標示為已讀。","good");
  await loadFeed();
}

async function publish(){
  const title=$("title").value.trim();
  const body=$("body").value.trim();
  if(!title)return setStatus("請輸入活動標題。","bad");
  if(!body)return setStatus("請輸入活動內容。","bad");

  $("publishBtn").disabled=true;
  setStatus("正在發布活動通知…");

  const eventAt=$("eventAt").value
    ? new Date($("eventAt").value).toISOString()
    : null;

  const {data,error}=await sb.rpc("joygo_activity_publish",{
    p_title:title,
    p_body:body,
    p_event_at:eventAt,
    p_location:$("location").value.trim()||null,
    p_signup_url:$("signupUrl").value.trim()||null,
    p_audience:$("audience").value
  });

  $("publishBtn").disabled=false;

  if(error){
    setStatus("發布失敗："+error.message,"bad");
    return;
  }

  const row=Array.isArray(data)?data[0]:data;
  const recipientCount=row?.recipient_count??0;
  const activityId=row?.activity_id;

  if($("sendEmail").checked && activityId){
    setStatus(`✅ 站內通知已發布 ${recipientCount} 位會員；正在寄送 Email…`,"good");
    try{
      const {data:{session:mailSession}}=await sb.auth.getSession();
      const resp=await fetch(
        SUPABASE_URL+"/functions/v1/joygo-send-activity-email",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+mailSession.access_token
          },
          body:JSON.stringify({activity_id:activityId})
        }
      );
      const mailResult=await resp.json().catch(()=>({}));
      if(!resp.ok){
        setStatus(
          `✅ 站內通知已發布 ${recipientCount} 位；⚠️ Email 尚未完成：${mailResult.error||"寄信服務錯誤"}`,
          "bad"
        );
      }else{
        setStatus(
          `✅ 發布完成：站內 ${recipientCount} 位，Email 成功 ${mailResult.sent_count??0} 封，失敗 ${mailResult.failed_count??0} 封。`,
          (mailResult.failed_count??0)>0?"bad":"good"
        );
      }
    }catch(e){
      setStatus(
        `✅ 站內通知已發布 ${recipientCount} 位；⚠️ Email 寄送連線失敗：${e.message}`,
        "bad"
      );
    }
  }else{
    setStatus(`✅ 站內通知發布成功，共通知 ${recipientCount} 位會員。`,"good");
  }

  clearForm();
  await Promise.all([loadAdmin(),loadFeed()]);
}

async function retractActivity(id,title){
  if(!confirm(`確定要收回「${title}」嗎？\n\n收回後會員端將立即看不到這則通知，但管理員仍可保留紀錄。`)) return;
  setStatus("正在收回通知…");
  const {data,error}=await sb.rpc("joygo_activity_retract",{p_activity_id:id});
  if(error){setStatus("收回失敗："+error.message,"bad");return}
  if(data!==true){setStatus("這則通知可能已收回，或您沒有權限。","bad");return}
  setStatus("✅ 通知已收回，會員端不再顯示。","good");
  await Promise.all([loadAdmin(),loadFeed()]);
}
window.retractActivity=retractActivity;

async function deleteActivity(id,title){
  if(!confirm(`⚠️ 確定永久刪除「${title}」嗎？\n\n此動作會同時刪除該活動的會員通知與 Email 寄送紀錄，而且無法復原。`)) return;
  setStatus("正在永久刪除通知…");
  const {data,error}=await sb.rpc("joygo_activity_delete",{p_activity_id:id});
  if(error){setStatus("刪除失敗："+error.message,"bad");return}
  if(data!==true){setStatus("找不到可刪除的通知，或您沒有權限。","bad");return}
  setStatus("✅ 通知已永久刪除。","good");
  await Promise.all([loadAdmin(),loadFeed()]);
}
window.deleteActivity=deleteActivity;

async function loadAdmin(){
  const {data,error}=await sb.rpc("joygo_activity_admin_list_v2",{p_limit:30});
  if(error){
    $("adminList").innerHTML='<div class="empty">管理列表讀取失敗：'+esc(error.message)+'</div>';
    return;
  }
  const rows=data||[];
  const recipients=rows.reduce((n,x)=>n+Number(x.recipient_count||0),0);
  const active=rows.filter(x=>x.status==='published').length;
  const recalled=rows.filter(x=>x.status==='cancelled').length;
  $("adminStats").innerHTML=
    `<div class="stat">最近 ${rows.length} 場</div><div class="stat">有效 ${active}</div><div class="stat">已收回 ${recalled}</div><div class="stat">通知人次 ${recipients}</div>`;

  if(!rows.length){
    $("adminList").innerHTML='<div class="empty">尚未發布活動。</div>';
    return;
  }

  $("adminList").innerHTML=rows.map(x=>{
    const statusBadge=x.status==='published'
      ? '<span class="badge">發布中</span>'
      : x.status==='cancelled'
        ? '<span class="badge">已收回</span>'
        : '<span class="badge">已封存</span>';
    const recallBtn=x.status==='published'
      ? `<button class="gold" onclick='retractActivity(${JSON.stringify(x.activity_id)},${JSON.stringify(x.title)})'>收回</button>`
      : '';
    const deleteBtn=`<button class="danger" onclick='deleteActivity(${JSON.stringify(x.activity_id)},${JSON.stringify(x.title)})'>永久刪除</button>`;
    return `
      <article class="item">
        <h3>${esc(x.title)} ${statusBadge}</h3>
        <div class="meta">
          對象：${esc(x.audience_label)}　
          收件：${x.recipient_count}　
          已讀：${x.read_count}　
          發布：${esc(fmt(x.published_at))}
        </div>
        <div class="bodytext">${esc(x.body)}</div>
        <div class="item-actions">${recallBtn}${deleteBtn}</div>
      </article>`;
  }).join("");
}

$("publishBtn").addEventListener("click",publish);
$("clearBtn").addEventListener("click",clearForm);
$("refreshBtn").addEventListener("click",loadFeed);
$("readAllBtn").addEventListener("click",markAllRead);

init();
</script>
</body>
</html>
