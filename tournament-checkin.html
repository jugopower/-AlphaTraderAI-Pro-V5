<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joy Go｜8 人瑞士制報到大廳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07130d;--panel:#0d1d14;--line:#315940;--gold:#f0cb68;--text:#f7f3e7;--muted:#a9b9ad}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#06110c,#0a1c12);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.head,.card{border:1px solid var(--line);background:rgba(10,27,18,.95);border-radius:18px}.head{padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{margin:0;color:var(--gold);font-size:25px}.sub{color:var(--muted);font-size:13px;line-height:1.5}.badge{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-weight:800;white-space:nowrap}.badge.open{color:#bff5d2;border-color:#4f9368;background:#112d1d}.badge.closed{color:#ffd0a6;border-color:#8a6135;background:#2b1c10}.hero{margin-top:12px;padding:20px;text-align:center}.count{font-size:56px;font-weight:900;color:var(--gold);line-height:1}.count small{font-size:22px;color:var(--muted)}.message{margin-top:10px;font-weight:800;font-size:18px}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}button,a.btn{border:1px solid #48664f;background:#17281d;color:white;border-radius:12px;padding:12px 18px;font-weight:900;text-decoration:none;font-size:15px}button.primary{background:linear-gradient(135deg,#f5d36d,#d9a72d);color:#1d1609;border:0}button.green{background:#185c37;border-color:#3c9a63}.danger{background:#4a1b1b!important;border-color:#8a4040!important}.ghost{background:#111b15!important}button:disabled{opacity:.45}.card{margin-top:12px;padding:16px}.card h2{margin:0 0 12px;color:var(--gold)}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.person{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:12px;border:1px solid #274b35;border-radius:13px;background:#0b1710}.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#26382d;font-weight:900}.person.in{border-color:#4e9e6c;background:#10291b}.person.in .dot{background:#226440}.name{font-weight:900}.rank{color:var(--gold);font-size:12px;margin-top:3px}.state{font-size:12px;font-weight:900;padding:6px 8px;border-radius:999px;background:#202a23;color:#aeb8b0}.person.in .state{background:#1d5938;color:#d6f8e2}.admin{display:none}.admin.show{display:block}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.notice{position:sticky;bottom:10px;margin-top:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#0c1d14;color:#dce9df}.notice.bad{border-color:#8e4545;color:#ffc2c2}.notice.good{border-color:#3d8c5c;color:#c8f2d5}@media(max-width:700px){.wrap{padding:9px}.head{align-items:flex-start;flex-direction:column}.roster{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.count{font-size:46px}.actions button,.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<section class="head"><div><h1>🏆 8 人瑞士制報到大廳</h1><div class="sub">Joy Go Platform｜Beta 3.4.9｜賽前報到</div></div><div id="openBadge" class="badge closed">報到未開放</div></section>
<section class="card hero"><div id="eventCode" class="sub">JOYGO8-TEST-001</div><div class="count"><span id="checkCount">0</span><small> / 8</small></div><div id="mainMessage" class="message">正在讀取報到狀態…</div><div id="meLine" class="sub" style="margin-top:8px">確認登入中…</div><div class="actions"><button id="checkinBtn" class="primary" disabled>✅ 我要報到</button><button id="cancelBtn" class="ghost" disabled>取消報到</button><a class="btn ghost" href="platform.html">返回平台</a></div></section>
<section class="card"><h2>👥 參賽名單</h2><div class="sub" style="margin-bottom:10px">不需要 8 人同一秒登入；在規定時間內完成報到即可。</div><div id="roster" class="roster"></div></section>
<section id="adminBox" class="card admin"><h2>👑 主管理員控制</h2><div class="admin-grid"><button id="openBtn" class="green">開放報到</button><button id="closeBtn">關閉報到</button><button id="resetBtn" class="danger">清空本場報到</button></div><div class="actions"><a class="btn" href="tournament-admin.html?tournament=JOYGO8-TEST-001">前往瑞士制管理</a></div><div class="sub">建議：8/8 到齊後先關閉報到，再到瑞士制管理頁產生第 1 輪配對。</div></section>
<div id="notice" class="notice">準備中…</div>
</div>
<script>
const CFG={url:"https://kpwfkmkxtrwmlxhomaxy.supabase.co",key:"sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr"};
const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const CODE=new URLSearchParams(location.search).get("tournament")||"JOYGO8-TEST-001";let me=null,isAdmin=false,state=null,board=[];const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function note(t,k=""){const n=$("notice");n.className="notice"+(k?" "+k:"");n.textContent=t}
function render(){const count=Number(state?.checked_in_count||0),cap=Number(state?.capacity||8),open=!!state?.checkin_open;$("eventCode").textContent=CODE;$("checkCount").textContent=count;$("openBadge").textContent=open?"🟢 報到開放中":"🔒 報到未開放";$("openBadge").className="badge "+(open?"open":"closed");const mine=board.find(x=>x.user_id===me?.id);$("meLine").textContent=me?`目前帳號：${mine?.real_name||me.email||"會員"}${mine?.rank?"｜"+mine.rank:""}`:"尚未登入";const myIn=!!mine?.checked_in;$("checkinBtn").disabled=!open||!mine||myIn;$("cancelBtn").disabled=!open||!mine||!myIn;if(count>=cap&&cap>0)$("mainMessage").textContent="🎉 全員到齊，可以開始第 1 輪";else if(open)$("mainMessage").textContent=`等待報到中，尚差 ${Math.max(0,cap-count)} 人`;else $("mainMessage").textContent="等待主管理員開放報到";$("roster").innerHTML=board.map((p,i)=>`<div class="person ${p.checked_in?"in":""}"><div class="dot">${p.checked_in?"✓":i+1}</div><div><div class="name">${esc(p.real_name||"未命名")}</div><div class="rank">${esc(p.rank||"—")}</div></div><div class="state">${p.checked_in?"已報到":"未報到"}</div></div>`).join("")||'<div class="sub">目前沒有正式參賽名單。</div>';$("adminBox").classList.toggle("show",isAdmin);if(isAdmin){$("openBtn").disabled=open;$("closeBtn").disabled=!open}}
async function refresh(showMsg=false){const [s,b]=await Promise.all([sb.rpc("joygo_tournament_checkin_state_v1",{p_tournament_code:CODE}),sb.rpc("joygo_tournament_checkin_board_v1",{p_tournament_code:CODE})]);if(s.error)throw s.error;if(b.error)throw b.error;state=Array.isArray(s.data)?s.data[0]:s.data;board=b.data||[];render();if(showMsg)note("✅ 報到資料已更新","good")}
async function init(){try{const {data,error}=await sb.auth.getSession();if(error||!data?.session){note("請先回 Joy Go Platform 登入會員帳號。","bad");return}me=data.session.user;const a=await sb.rpc("joygo_is_admin_v1");isAdmin=!a.error&&a.data===true;await refresh();note("✅ 報到大廳已連線","good");setInterval(()=>refresh(false).catch(()=>{}),5000)}catch(e){note("讀取失敗："+(e?.message||e),"bad")}}
$("checkinBtn").onclick=async()=>{try{$("checkinBtn").disabled=true;const {error}=await sb.rpc("joygo_tournament_checkin_v1",{p_tournament_code:CODE});if(error)throw error;await refresh();note("✅ 報到成功","good")}catch(e){note("報到失敗："+(e?.message||e),"bad");render()}};
$("cancelBtn").onclick=async()=>{if(!confirm("確定取消本場報到？"))return;try{const {error}=await sb.rpc("joygo_tournament_cancel_checkin_v1",{p_tournament_code:CODE});if(error)throw error;await refresh();note("已取消報到")}catch(e){note("取消失敗："+(e?.message||e),"bad")}};
$("openBtn").onclick=async()=>{try{const {error}=await sb.rpc("joygo_admin_set_checkin_open_v1",{p_tournament_code:CODE,p_open:true});if(error)throw error;await refresh();note("✅ 已開放報到","good")}catch(e){note("開放失敗："+(e?.message||e),"bad")}};
$("closeBtn").onclick=async()=>{try{const {error}=await sb.rpc("joygo_admin_set_checkin_open_v1",{p_tournament_code:CODE,p_open:false});if(error)throw error;await refresh();note("🔒 已關閉報到","good")}catch(e){note("關閉失敗："+(e?.message||e),"bad")}};
$("resetBtn").onclick=async()=>{if(!confirm("確定清空本場所有報到紀錄？\n只清報到，不會刪除報名、瑞士制配對或比賽成績。"))return;try{const {error}=await sb.rpc("joygo_admin_reset_checkins_v1",{p_tournament_code:CODE});if(error)throw error;await refresh();note("✅ 報到紀錄已清空","good")}catch(e){note("清空失敗："+(e?.message||e),"bad")}};init();
</script>
</body></html>
