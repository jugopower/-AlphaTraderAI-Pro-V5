<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>比賽報名管理｜Joy Go Platform</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#090b0a;--p:#141b17;--p2:#1d2a22;--gold:#f2bd43;--ink:#fff9e8;--muted:#bdc5bd;--line:#445a49;--green:#54d598;--red:#ff8e8e;--blue:#80c9ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#070908,#14241a);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,input,select{font:inherit}.shell{width:min(1280px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{color:#ffe083;margin:0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#101813;color:var(--ink);font-weight:850;text-decoration:none}.btn.gold{background:linear-gradient(135deg,#ffe083,#d6941f);color:#211400;border:0}.notice{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}.notice.good{border-color:#287956;color:#9cedc6}.notice.bad{border-color:#934343;color:#ffb1b1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:#111a15}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;color:#ffe083;font-size:26px;margin-top:5px}.card{border:1px solid var(--line);border-radius:18px;background:#0d130f;overflow:hidden}.toolbar{padding:12px;display:flex;gap:8px;border-bottom:1px solid #314337}.toolbar input{flex:1;min-width:0;background:#070a08;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1150px}th,td{padding:11px 10px;border-bottom:1px solid #27352c;text-align:left;vertical-align:top;font-size:13px}th{background:#1b2820;color:#ffe083;position:sticky;top:0}.name{font-weight:900;font-size:15px}.sub{color:var(--muted);font-size:12px;line-height:1.45}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-weight:900;font-size:11px}.approved{background:#124b33;color:#8bf0bf}.pending{background:#53441f;color:#ffe3a1}.waitlist{background:#173f57;color:#a7ddff}.rejected{background:#562929;color:#ffb3b3}.ops{display:flex;flex-wrap:wrap;gap:6px}.ops button{border:0;border-radius:9px;padding:7px 9px;font-weight:900}.approve{background:#56d598;color:#062216}.wait{background:#80c9ff;color:#082235}.reject{background:#ff8e8e;color:#3c0808}.review{background:#d7b66d;color:#2b1d05}@media(max-width:700px){.shell{padding:10px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.actions{width:100%;flex-wrap:wrap}}
</style></head><body><main class="shell"><header class="top"><div><h1>👑 比賽報名管理</h1><div class="sub">Joy Go Platform｜16 人賽資格審核</div></div><div class="actions"><button id="refresh" class="btn">重新整理</button><a class="btn" href="tournament-register.html">選手報名頁</a><a class="btn gold" href="index.html">返回平台</a></div></header><div id="notice" class="notice">正在確認管理員身分…</div><section id="content" hidden><div class="stats"><div class="stat"><span>全部報名</span><b id="total">0</b></div><div class="stat"><span>正式參賽</span><b id="approved">0</b></div><div class="stat"><span>待審核</span><b id="pending">0</b></div><div class="stat"><span>候補／未通過</span><b id="other">0</b></div></div><section class="card"><div class="toolbar"><input id="search" placeholder="搜尋姓名、Email、電話、棋帳號"><button id="clear" class="btn">清除</button></div><div class="wrap"><table><thead><tr><th>#</th><th>選手</th><th>聯絡／棋力</th><th>付款</th><th>身分</th><th>資格</th><th>送出時間</th><th>管理操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><script>
const CFG={url:"https://kpwfkmkxtrwmlxhomaxy.supabase.co",key:"sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr"};const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const CODE="JOYGO16-001";let all=[];const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function msg(t,k=""){const e=$("notice");e.className="notice"+(k?" "+k:"");e.textContent=t}const rl=s=>({pending:"待審核",approved:"正式參賽",waitlist:"候補",rejected:"未通過",cancelled:"已取消"}[s]||s);const pl=s=>({pending:"待確認",paid:"已繳費",rejected:"有問題",refunded:"已退款"}[s]||s);const il=s=>({pending:"待查核",verified:"已通過",rejected:"未通過"}[s]||s);
function render(){const q=$("search").value.trim().toLowerCase();const arr=all.filter(r=>!q||[r.real_name,r.email,r.phone,r.rank,r.go_account,r.payment_last5].join(" ").toLowerCase().includes(q));$("rows").innerHTML=arr.map((r,i)=>`<tr><td>${i+1}</td><td><div class="name">${esc(r.real_name)}</div><div class="sub">${esc(r.email)}</div></td><td><b>${esc(r.rank)}</b><div class="sub">${esc(r.phone)}<br>${esc(r.go_account||"—")}</div></td><td><b>NT$ ${Number(r.payment_amount||0).toLocaleString()}</b><div class="sub">後五碼 ${esc(r.payment_last5)}<br>${esc(pl(r.payment_status))}</div></td><td>${esc(il(r.identity_status))}</td><td><span class="pill ${esc(r.registration_status)}">${esc(rl(r.registration_status))}</span>${r.admin_note?`<div class="sub">${esc(r.admin_note)}</div>`:""}</td><td>${new Date(r.created_at).toLocaleString("zh-TW")}</td><td><div class="ops"><button class="approve" onclick="approveReg('${r.id}')">✓ 核准</button><button class="review" onclick="markPending('${r.id}')">待審</button><button class="wait" onclick="waitReg('${r.id}')">候補</button><button class="reject" onclick="rejectReg('${r.id}')">退回</button></div></td></tr>`).join("")||'<tr><td colspan="8" class="sub" style="padding:30px;text-align:center">目前沒有符合資料。</td></tr>';$("total").textContent=all.length;$("approved").textContent=all.filter(x=>x.registration_status==='approved').length;$("pending").textContent=all.filter(x=>x.registration_status==='pending').length;$("other").textContent=all.filter(x=>['waitlist','rejected'].includes(x.registration_status)).length}
async function load(){msg("正在讀取報名名單…");const {data,error}=await sb.from("tournament_registrations").select("*").eq("tournament_code",CODE).order("created_at",{ascending:true});if(error)throw error;all=data||[];render();msg("✅ 報名名單已更新。正式參賽 "+all.filter(x=>x.registration_status==='approved').length+" / 16 人。","good")}
async function review(id,is,pay,reg,note=""){msg("正在更新審核狀態…");const {error}=await sb.rpc("joygo_review_tournament_registration",{p_registration_id:id,p_identity_status:is,p_payment_status:pay,p_registration_status:reg,p_admin_note:note});if(error){msg("操作失敗："+error.message,"bad");return}await load()}
window.approveReg=async id=>{msg("正在核准…");const {error}=await sb.rpc("joygo_approve_tournament_registration",{p_registration_id:id});if(error){msg("核准失敗："+error.message,"bad");return}await load()};window.markPending=id=>review(id,"pending","pending","pending","");window.waitReg=id=>review(id,"verified","paid","waitlist","正式名額未確認，暫列候補");window.rejectReg=id=>{const note=prompt("退回原因（例如：付款資料不符）","")||"資料待補正";review(id,"rejected","rejected","rejected",note)};$("refresh").onclick=()=>load().catch(e=>msg("讀取失敗："+e.message,"bad"));$("search").oninput=render;$("clear").onclick=()=>{$("search").value="";render()};
async function init(){try{const {data,error}=await sb.auth.getSession();if(error||!data?.session){msg("請先回 Joy Go Platform 登入管理員帳號。","bad");return}const uid=data.session.user.id;const {data:p,error:pe}=await sb.from("profiles").select("role,status").eq("id",uid).single();if(pe||p?.role!=="admin"||p?.status!=="active"){msg("此頁只有 Joy Go 管理員可使用。","bad");return}$("content").hidden=false;await load()}catch(e){msg("系統錯誤："+(e?.message||e),"bad")}}init();
</script></body></html>
