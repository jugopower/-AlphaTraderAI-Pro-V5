<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joy Go 獎勵中心 Beta 1.0</title>
<style>body{margin:0;background:#eee8dc;color:#33291f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.top,.card{background:#faf7f0;border:1px solid #d7c9b5;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #5a463018}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:1px solid #9d815f;background:#fffaf1;color:#493725;border-radius:10px;padding:9px 13px;text-decoration:none;cursor:pointer}.gold{background:#8c6b42;color:white}.balance{font-size:34px;font-weight:900;color:#7b5a31}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.reward{border:1px solid #d7c9b5;border-radius:14px;padding:14px;background:#fffdf8}.muted{color:#786b5c;font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eadfce}.ok{color:#397249}.bad{color:#9b3d35}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="top"><div><h1>🏅 Joy Go 獎勵中心 <small>Beta 1.0</small></h1><div class="muted">下棋累積 Joy 點，兌換 Joy Go 專屬獎勵。</div></div><div><a class="btn" href="index.html">返回平台</a> <a class="btn" href="admin-rewards.html">管理設定</a></div></div>
<div class="card"><div class="muted">我的 Joy 點</div><div id="balance" class="balance">—</div><div id="week" class="muted">本週有效對局：讀取中…</div></div><div class="card"><h2>🎁 可兌換獎勵</h2><div id="rewards" class="grid"></div></div><div class="card"><h2>📜 最近點數紀錄</h2><div id="ledger"></div></div><div id="msg" class="muted"></div></div>
<script>
const CFG={url:'https://kpwfkmkxtrwmlxhomaxy.supabase.co',key:'sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr'};
function getCfg(){try{const c=JSON.parse(localStorage.getItem('joygo-member-supabase-v1')||'{}');return {url:c.url||c.supabaseUrl||CFG.url,key:c.key||c.anonKey||c.supabaseAnonKey||CFG.key}}catch{return CFG}}
const c=getCfg(),sb=supabase.createClient(c.url,c.key);const $=id=>document.getElementById(id);function msg(s,bad=false){$('msg').className=bad?'bad':'ok';$('msg').textContent=s}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){msg('請先登入 Joy Go Platform。',true);return}await load()}
async function load(){const [{data:bal},{data:led},{data:rews}]=await Promise.all([sb.rpc('joygo_points_balance',{}),sb.from('joygo_points_ledger').select('*').order('created_at',{ascending:false}).limit(20),sb.from('joygo_rewards').select('*').eq('enabled',true).order('points_cost')]);$('balance').textContent=(bal??0)+' 點';const weekStart=new Date();weekStart.setHours(0,0,0,0);weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));const games=(led||[]).filter(x=>x.source_key?.startsWith('game:')&&new Date(x.created_at)>=weekStart).length;$('week').textContent='本週有效對局：'+games+' 局';$('ledger').innerHTML=(led||[]).map(x=>`<div class="row"><span>${x.reason}<div class="muted">${new Date(x.created_at).toLocaleString()}</div></span><b class="${x.points>=0?'ok':'bad'}">${x.points>=0?'+':''}${x.points}</b></div>`).join('')||'<div class="muted">尚無點數紀錄</div>';$('rewards').innerHTML=(rews||[]).map(r=>`<div class="reward"><h3>${r.name}</h3><div class="muted">${r.description||''}</div><p><b>${r.points_cost} Joy 點</b>｜${r.stock==null?'不限量':'剩 '+r.stock+' 份'}</p><button class="btn gold" onclick="redeem(${r.id},'${String(r.name).replaceAll("'","\\'")}')">兌換</button></div>`).join('')||'<div class="muted">目前沒有上架獎勵</div>'}
async function redeem(id,name){if(!confirm(`確定使用 Joy 點兌換「${name}」？`))return;const {data,error}=await sb.rpc('joygo_redeem_reward',{p_reward_id:id});if(error)return msg('兌換失敗：'+error.message,true);msg('✅ 兌換成功，管理員將依兌換紀錄處理。');await load()};init();
</script></body></html>
