<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joy Go 獎勵中心 Beta 1.0c</title>
<style>
:root{color-scheme:dark;--bg:#08100c;--panel:#0f1913;--panel2:#16251b;--ink:#f8f2e3;--muted:#b7c3b9;--line:#355241;--gold:#e7bd62;--gold2:#ffe08a;--green:#4fc08a;--red:#e87d78;--field:#09110d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#183b28 0,transparent 35%),linear-gradient(145deg,#050907,#0b1b11);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;min-height:100vh}.wrap{max-width:920px;margin:auto;padding:18px}.top,.card{background:rgba(15,25,19,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.22)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0 0 8px;color:var(--gold2)}.btn{border:1px solid #58725f;background:#14251a;color:var(--ink);border-radius:10px;padding:9px 13px;text-decoration:none;cursor:pointer;font-weight:700}.btn:hover{background:#1c3425}.gold{background:#8b6a2d;border-color:#c89d49;color:#fff8e6}.gold:hover{background:#a47d35}.balance{font-size:34px;font-weight:900;color:var(--gold2)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.reward{border:1px solid var(--line);border-radius:14px;padding:14px;background:#132219}.reward h3{color:#fff;margin-top:0}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #294333}.ok{color:var(--green)}.bad{color:var(--red)}h2{color:#f7df9a}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="top"><div><h1>🏅 Joy Go 獎勵中心 <small>Beta 1.0c</small></h1><div class="muted">下棋累積 Joy 點，兌換 Joy Go 專屬獎勵。</div></div><div><a class="btn" href="index.html">返回平台</a> <a class="btn" href="admin-rewards.html">管理設定</a></div></div>
<div class="card"><div class="muted">我的 Joy 點</div><div id="balance" class="balance">—</div><div id="week" class="muted">本週有效對局：讀取中…</div></div><div class="card"><h2>🎁 可兌換獎勵</h2><div id="rewards" class="grid"></div></div><div class="card"><h2>📜 最近點數紀錄</h2><div id="ledger"></div></div><div id="msg" class="muted"></div></div>
<script>
const CFG={url:'https://kpwfkmkxtrwmlxhomaxy.supabase.co',key:'sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr'};
function getCfg(){try{const c=JSON.parse(localStorage.getItem('joygo-member-supabase-v1')||'{}');return {url:c.url||c.supabaseUrl||CFG.url,key:c.key||c.anonKey||c.supabaseAnonKey||CFG.key}}catch{return CFG}}
const c=getCfg(),sb=supabase.createClient(c.url,c.key);const $=id=>document.getElementById(id);function msg(s,bad=false){$('msg').className=bad?'bad':'ok';$('msg').textContent=s}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){msg('請先登入 Joy Go Platform。',true);return}await load()}
async function load(){
 const [b,l,r]=await Promise.all([sb.rpc('joygo_points_balance',{}),sb.from('joygo_points_ledger').select('*').order('created_at',{ascending:false}).limit(20),sb.from('joygo_rewards').select('*').eq('enabled',true).order('points_cost',{ascending:true})]);
 if(b.error)msg('Joy 點讀取失敗：'+b.error.message,true);
 if(l.error)msg('點數紀錄讀取失敗：'+l.error.message,true);
 if(r.error){$('rewards').innerHTML='<div class="bad">獎勵讀取失敗：'+r.error.message+'</div>';msg('獎勵資料讀取失敗，請截圖給管理員。',true)}
 const bal=b.data,led=l.data||[],rews=r.data||[];$('balance').textContent=(bal??0)+' 點';
 const w=new Date();w.setHours(0,0,0,0);w.setDate(w.getDate()-((w.getDay()+6)%7));
 $('week').textContent='本週有效對局：'+led.filter(x=>x.source_key?.startsWith('game:')&&new Date(x.created_at)>=w).length+' 局';
 $('ledger').innerHTML=led.map(x=>`<div class="row"><span>${x.reason}<div class="muted">${new Date(x.created_at).toLocaleString()}</div></span><b class="${x.points>=0?'ok':'bad'}">${x.points>=0?'+':''}${x.points}</b></div>`).join('')||'<div class="muted">尚無點數紀錄</div>';
 if(!r.error)$('rewards').innerHTML=rews.map(x=>`<div class="reward"><h3>${x.name}</h3><div class="muted">${x.description||''}</div><p><b>${x.points_cost} Joy 點</b>｜${x.stock==null?'不限量':'剩 '+x.stock+' 份'}</p><button class="btn gold" onclick="redeem(${x.id},'${String(x.name).replaceAll("'","\\'")}')">兌換</button></div>`).join('')||'<div class="muted">目前沒有上架獎勵</div>';
}
async function redeem(id,name){if(!confirm(`確定使用 Joy 點兌換「${name}」？`))return;const {data,error}=await sb.rpc('joygo_redeem_reward',{p_reward_id:id});if(error)return msg('兌換失敗：'+error.message,true);msg('✅ 兌換成功，管理員將依兌換紀錄處理。');await load()};init();
</script></body></html>
