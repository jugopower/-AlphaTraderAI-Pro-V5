<div class="wrap">

<label>基本時間(分) <input id="mainMin" type="number" value="20" min="0" style="width:80px"></label><label>讀秒(秒) <input id="byoSec" type="number" value="30" min="5" style="width:76px"></label><label>次數 <input id="byoPeriods" type="number" value="3" min="1" style="width:60px"></label></div>

<script>
const CFG={url:"https://kpwfkmkxtrwmlxhomaxy.supabase.co",key:"sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr"};
const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);let me=null,profiles=[],currentSession="",boards=[],activeSlot=1,roomChannel=null;
function notice(t,k=""){const n=$("notice");n.textContent=t;n.className="notice"+(k?" "+k:"")}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function profileOptions(sel=""){return '<option value="">選擇學生</option>'+profiles.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.display_name||'會員')}</option>`).join('')}
function renderStudentRows(){const n=Number($("studentCount").value||1),box=$("studentRows");const old=[...box.querySelectorAll('.student-row')].map(r=>({id:r.querySelector('.student')?.value||'',rank:r.querySelector('.rank')?.value||'',h:r.querySelector('.handicap')?.value||'0'}));box.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('div');d.className='student-row';d.innerHTML=`<b>學生 ${i+1}</b><select class="student">${profileOptions(old[i]?.id||'')}</select><input class="rank" placeholder="棋力，例如 3段" maxlength="20" value="${esc(old[i]?.rank||'')}"><select class="handicap"><option value="0">分先</option>${[2,3,4,5,6,7,8,9].map(x=>`<option value="${x}" ${String(x)===old[i]?.h?'selected':''}>讓 ${x} 子</option>`).join('')}</select>`;box.appendChild(d)}}

$("studentCount").onchange=renderStudentRows;

const TEACHER_IDENTITIES={
  self:{code:"self",name:"朱老師",rank:"",title:"朱老師線上指導棋"},
  SAI:{code:"SAI",name:"棋王 SAI",rank:"9段",title:"棋王 SAI 線上指導棋"}
};

function selectedTeacherIdentity(){
  const code=$("teacherIdentity")?.value||"self";
  return TEACHER_IDENTITIES[code]||TEACHER_IDENTITIES.self;
}

function syncTeacherIdentityUI(){
  const t=selectedTeacherIdentity();
  if($("title")){
    const current=$("title").value.trim();
    const autoNames=["朱老師線上指導棋","棋王 SAI 線上指導棋","線上指導棋"];
    if(!current || autoNames.includes(current)) $("title").value=t.title;
  }
  if($("teacherIdentityNote")){
    $("teacherIdentityNote").textContent=t.code==="SAI"
      ? "目前身分：棋王 SAI｜9段｜官方虛擬棋手｜可開 1 對 1～1 對 5"
      : "目前身分：朱老師｜可開 1 對 1～1 對 5";
  }
}

$("teacherIdentity").onchange=syncTeacherIdentityUI;
syncTeacherIdentityUI();

async function loadProfiles(){
  const {data,error}=await sb.rpc('joygo_guidance_student_directory');
  if(error)throw error;
  profiles=(data||[]).filter(p=>p.id!==me.id);
  renderStudentRows();
}

async function autoSwitchToNewestLiveSession(endedSessionId=null){
  // Beta 2.9.3：
  // 不再只靠前端 live_sessions 陣列判斷。
  // 直接由資料庫選出「排除剛結束場次」後的最新未完場次。
  for(let attempt=0;attempt<3;attempt++){
    const {data,error}=await sb.rpc(
      'joygo_guidance_next_live_session',
      {p_exclude_session_id:endedSessionId||null}
    );

    if(!error){
      const row=Array.isArray(data)?data[0]:data;

      if(row?.session_id && Number(row.live_count||0)>0){
        const nextId=String(row.session_id);

        // 先切換 currentSession，再開啟。
        currentSession=nextId;

        const opened=await openSession(nextId,true);
        if(opened)return true;
      }

      // RPC 正常回傳，但確實沒有下一場。
      if(!row?.session_id)return false;
    }

    // Realtime / transaction 剛完成時，短暫等待再試。
    await new Promise(r=>setTimeout(r,300*(attempt+1)));
  }

  return false;
}

async function loadSessions(){
  const {data,error}=await sb.rpc('joygo_guidance_live_sessions');
  if(error){$("sessions").textContent='讀取失敗：'+error.message;return}
  const rows=(data||[]).filter(s=>Number(s.live_count||0)>0);
  $("sessions").innerHTML=rows.length
    ?rows.map(s=>`<button class="session-chip" data-id="${s.session_id}">${esc(s.title)}｜${s.live_count}/${s.student_count}盤進行中</button>`).join('')
    :'<span class="small">目前沒有進行中的指導棋。</span>';
  document.querySelectorAll('.session-chip').forEach(b=>b.onclick=()=>openSession(b.dataset.id))
}
async function createSession(){
  const rows=[...document.querySelectorAll('.student-row')],students=[],used=new Set();
  for(let i=0;i<rows.length;i++){
    const id=rows[i].querySelector('.student').value;
    if(!id)return notice(`請選擇學生 ${i+1}`,'bad');
    if(used.has(id))return notice('同一位學生不能重複加入','bad');
    used.add(id);
    const p=profiles.find(x=>x.id===id);
    students.push({
      user_id:id,
      name:p?.display_name||`學生${i+1}`,
      rank:rows[i].querySelector('.rank').value.trim(),
      handicap:Number(rows[i].querySelector('.handicap').value||0)
    });
  }

  const teacher=selectedTeacherIdentity();
  notice(`正在以「${teacher.name}${teacher.rank?`｜${teacher.rank}`:""}」建立 1 對 ${students.length} 指導棋…`);

  const {data,error}=await sb.rpc('joygo_guidance_create_session',{
    p_title:$("title").value.trim()||teacher.title,
    p_students:students,
    p_main_seconds:Math.max(0,Number($("mainMin").value||20)*60),
    p_byo_seconds:Math.max(5,Number($("byoSec").value||30)),
    p_byo_periods:Math.max(1,Number($("byoPeriods").value||3))
  });

  if(error)return notice('建立失敗：'+error.message,'bad');
  if(!data?.length)return notice('建立完成但沒有取得棋盤資料','bad');

  if(teacher.code!=="self"){
    const roomCodes=(data||[]).map(x=>x.room_code).filter(Boolean);
    if(roomCodes.length){
      const {error:ve}=await sb.rpc('joygo_guidance_apply_virtual_teacher',{
        p_room_codes:roomCodes,
        p_character_code:teacher.code
      });
      if(ve){
        console.warn("virtual teacher apply failed",ve);
        return notice(`棋局已建立，但 SAI 身分套用失敗：${ve.message}`,'bad');
      }
    }
  }

  notice(`✅ 已以「${teacher.name}${teacher.rank?`｜${teacher.rank}`:""}」建立 1 對 ${data.length} 指導棋。`,'good');
  await loadSessions();
  await openSession(data[0].session_id);
}
$("createBtn").onclick=createSession;
function tabLabel(b){
  if(b.room_status==='ended')return '✅ 已結束';
  if(b.room_turn==='W')return '🔴 等老師';
  return '🟢 學生思考';
}
function activeBoards(){return boards.filter(b=>b.room_status!=='ended')}
function normalizeBoards(rows){
  return (rows||[]).map(b=>{
    const ended=b.room_status==='ended';
    return {
      ...b,
      tab_status: ended
        ? 'ended'
        : (b.room_turn==='W' ? 'waiting_teacher' : 'waiting_student')
    };
  });
}

function renderTabs(){const live=activeBoards();$("tabs").innerHTML=live.map(b=>`<button class="tab ${b.slot_no===activeSlot?'active':''} ${b.tab_status==='waiting_teacher'?'wait-teacher':''}" data-slot="${b.slot_no}"><div class="tab-name">${esc(b.student_name)} ${esc(b.student_rank||'')}</div><div class="tab-meta">${tabLabel(b)}｜${b.handicap?`讓${b.handicap}子`:'分先'}｜${esc(b.room_code)}</div></button>`).join('');document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>activate(Number(t.dataset.slot)))}

function fitBoardFrame(f){
  if(!f || !f.contentWindow) return;
  try{
    // 讓內嵌 index.html 在 iPad 轉向後重新跑自己的 responsive / resize 邏輯
    f.contentWindow.dispatchEvent(new Event('resize'));
    const doc=f.contentDocument;
    if(!doc) return;
    const h=Math.max(
      doc.documentElement?.scrollHeight||0,
      doc.body?.scrollHeight||0,
      760
    );
    f.style.height=(h+24)+'px';
  }catch(e){
    // 同源失敗時保留安全高度，不影響棋局功能
    f.style.height=(window.innerWidth>window.innerHeight?'920px':'980px');
  }
}

function refitActiveBoard(keepPosition=true){
  const f=document.querySelector('.board-frame.active');
  if(!f) return;
  const top=keepPosition ? f.getBoundingClientRect().top + window.scrollY : null;

  // iPad Safari 旋轉不是一次完成，分三次重新量測最穩定
  [80,260,650].forEach(ms=>setTimeout(()=>{
    fitBoardFrame(f);
    if(ms===650 && keepPosition && top!==null){
      const headerH=document.querySelector('header')?.offsetHeight||0;
      const controls=document.getElementById('controlbar');
      const target=(controls?.getBoundingClientRect().top||f.getBoundingClientRect().top)+window.scrollY-headerH-10;
      window.scrollTo({top:Math.max(0,target),behavior:'auto'});
    }
  },ms));
}

let joygoRotateTimer=null;
function handleGuidanceViewportChange(){
  clearTimeout(joygoRotateTimer);
  joygoRotateTimer=setTimeout(()=>refitActiveBoard(true),120);
}
window.addEventListener('orientationchange',handleGuidanceViewportChange,{passive:true});
window.addEventListener('resize',handleGuidanceViewportChange,{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',handleGuidanceViewportChange,{passive:true});
}

function ensureFrame(b){let f=document.getElementById('frame-'+b.slot_no);if(!f){const e=$("frames").querySelector('.empty');if(e)e.remove();f=document.createElement('iframe');f.id='frame-'+b.slot_no;f.className='board-frame';
f.referrerPolicy='no-referrer';
f.setAttribute('allow','clipboard-write');
f.dataset.src=`index.html?room=${encodeURIComponent(b.room_code)}&guidance_embed=1&gv=295d`;
f.addEventListener('load',()=>{ setTimeout(()=>fitBoardFrame(f),80); setTimeout(()=>fitBoardFrame(f),350); });
$("frames").appendChild(f)}
if(!f.getAttribute('src'))f.src=f.dataset.src;
setTimeout(()=>fitBoardFrame(f),60);
return f}
function activate(slot){const live=activeBoards();if(!live.length){clearTeacherControl();return}const chosen=live.find(b=>b.slot_no===slot)||live[0];activeSlot=chosen.slot_no;live.forEach(b=>ensureFrame(b).classList.toggle('active',b.slot_no===activeSlot));renderTabs();renderCurrent();setTimeout(()=>refitActiveBoard(false),80)}
function clearTeacherControl(){document.querySelectorAll('.board-frame').forEach(f=>f.remove());$("tabs").innerHTML='';$("controlbar").style.display='none';$("frames").innerHTML='<div class="empty">✅ 本場棋局已結束，棋盤與標籤已自動清除；棋譜紀錄仍保留。</div>'}
function removeEndedFrames(){boards.filter(b=>b.room_status==='ended').forEach(b=>document.getElementById('frame-'+b.slot_no)?.remove())}
function renderCurrent(){const b=boards.find(x=>x.slot_no===activeSlot);if(!b)return;$("controlbar").style.display='flex';$("currentInfo").textContent=`第 ${b.slot_no} 盤｜${b.student_name} ${b.student_rank||''}｜${tabLabel(b)}｜房號 ${b.room_code}`;$("autoNext").checked=!!b.auto_next}
function nextWaitingTeacher(){const o=activeBoards().sort((a,b)=>a.slot_no-b.slot_no);if(!o.length){clearTeacherControl();return false}const start=Math.max(0,o.findIndex(x=>x.slot_no===activeSlot));for(let k=1;k<=o.length;k++){const b=o[(start+k)%o.length];if(b.room_status!=='ended'&&b.room_turn==='W'){activate(b.slot_no);return true}}notice('目前沒有其他等待老師落子的棋盤。');return false}
$("nextBtn").onclick=nextWaitingTeacher;$("refreshBtn").onclick=()=>refreshSession(true);$("copyBtn").onclick=async()=>{const b=boards.find(x=>x.slot_no===activeSlot);if(!b)return;const u=new URL('index.html',location.href);u.searchParams.set('room',b.room_code);const text=`Joy Go 指導棋｜${b.student_name}\n房號：${b.room_code}\n${u.href}`;try{await navigator.clipboard.writeText(text);notice('✅ 學生連結已複製','good')}catch{prompt('請複製學生連結：',text)}};
$("autoNext").onchange=async e=>{if(!currentSession)return;const {error}=await sb.rpc('joygo_guidance_set_auto_next',{p_session_id:currentSession,p_enabled:e.target.checked});if(error)notice('設定失敗：'+error.message,'bad');else boards.forEach(b=>b.auto_next=e.target.checked)};

async function getAuthoritativeSessionState(){
  if(!currentSession)return null;
  const {data,error}=await sb.rpc('joygo_guidance_session_state',{
    p_session_id:currentSession
  });
  if(error){
    console.warn('session_state failed',error);
    return null;
  }
  return Array.isArray(data)?data[0]:data;
}

async function confirmSessionReallyEnded(){
  const s=await getAuthoritativeSessionState();
  if(!s)return false;
  return Number(s.live_count||0)===0;
}

$("endBtn").onclick=async()=>{if(!currentSession||!confirm('確定結束整場指導棋？棋局與棋譜不會刪除。'))return;const {error}=await sb.rpc('joygo_guidance_end_session',{p_session_id:currentSession});if(error)return notice('結束失敗：'+error.message,'bad');notice('✅ 本場指導棋已標示結束。','good');await loadSessions();await refreshSession(true)};
async function refreshSession(manual=false){
  if(!currentSession)return;

  const prev=new Map(boards.map(b=>[
    b.room_id,
    {room_status:b.room_status,room_turn:b.room_turn}
  ]));

  const {data,error}=await sb.rpc(
    'joygo_guidance_get_session',
    {p_session_id:currentSession}
  );

  if(error){
    if(manual)notice('更新失敗：'+error.message,'bad');
    return;
  }

  const nextBoards=normalizeBoards(data);
  const nextLive=nextBoards.filter(b=>b.room_status!=='ended');

  // Beta 2.9.1：
  // 前端看到 0 盤時，不准自行判定整場結束。
  // 必須再由資料庫 session_state 確認 live_count=0。
  if(!nextLive.length){
    const reallyEnded=await confirmSessionReallyEnded();

    if(!reallyEnded){
      // 可能是 Realtime / RPC 短暫不同步。
      // 保留目前未完棋盤，不清空畫面，稍後再同步。
      if(manual){
        notice('⏳ 棋局狀態同步中；尚有未完棋局，不會清除老師總控。');
      }
      setTimeout(()=>refreshSession(false),650);
      return;
    }

    const endedSessionId=String(currentSession);

    boards=nextBoards;
    removeEndedFrames();
    clearTeacherControl();

    try{
      await sb.rpc(
        'joygo_guidance_mark_ended_if_complete',
        {p_session_id:endedSessionId}
      );
    }catch(e){}

    await loadSessions();

    const switched=await autoSwitchToNewestLiveSession(endedSessionId);

    if(!switched){
      currentSession='';
      if(manual){
        notice(
          '✅ 本場所有棋盤均已真正完局；目前沒有其他進行中的指導棋。',
          'good'
        );
      }
    }
    return;
  }

  // 有未完棋局才正式接受本次資料。
  boards=nextBoards;
  removeEndedFrames();

  const live=activeBoards();

  const a=
    live.find(b=>b.slot_no===activeSlot) ||
    live.find(b=>b.room_turn==='W') ||
    live[0];

  activeSlot=a.slot_no;
  renderTabs();
  renderCurrent();

  const cur=boards.find(b=>b.slot_no===activeSlot);
  const old=cur?prev.get(cur.room_id):null;

  if(
    cur &&
    cur.auto_next &&
    old &&
    old.room_status!=='ended' &&
    old.room_turn==='W' &&
    cur.room_status!=='ended' &&
    cur.room_turn==='B'
  ){
    setTimeout(nextWaitingTeacher,250);
  }

  if(manual)notice('✅ 指導棋狀態已更新','good');
}

async function subscribeRooms(){if(roomChannel){try{await sb.removeChannel(roomChannel)}catch{}}roomChannel=sb.channel('joygo-guidance-'+currentSession).on('postgres_changes',{event:'*',schema:'public',table:'online_rooms'},()=>refreshSession(false)).subscribe()}
async function openSession(id,fromAutoSwitch=false){
  currentSession=id;

  const {data,error}=await sb.rpc(
    'joygo_guidance_get_session',
    {p_session_id:id}
  );

  if(error){
    if(!fromAutoSwitch)notice('開啟失敗：'+error.message,'bad');
    return false;
  }

  const nextBoards=normalizeBoards(data);

  if(!nextBoards.length){
    const state=await getAuthoritativeSessionState();

    if(state && Number(state.live_count||0)>0){
      notice('⏳ 場次仍有未完棋局，正在重新同步，不會清除。');
      setTimeout(()=>openSession(id),650);
      return;
    }

    if(fromAutoSwitch)return false;

    currentSession='';
    clearTeacherControl();
    await loadSessions();

    const switched=await autoSwitchToNewestLiveSession(id);
    if(!switched){
      notice('目前沒有其他進行中的指導棋。','good');
    }
    return switched;
  }

  const nextLive=nextBoards.filter(b=>b.room_status!=='ended');

  if(!nextLive.length){
    const reallyEnded=await confirmSessionReallyEnded();

    if(!reallyEnded){
      notice('⏳ 尚有未完棋局，正在重新同步，不會清除老師總控。');
      setTimeout(()=>openSession(id),650);
      return;
    }

    const endedId=String(id);
    const endedTitle=nextBoards[0]?.title||'本場指導棋';

    boards=nextBoards;
    $("frames").innerHTML='';
    clearTeacherControl();

    try{
      await sb.rpc(
        'joygo_guidance_mark_ended_if_complete',
        {p_session_id:endedId}
      );
    }catch(e){}

    await loadSessions();

    if(fromAutoSwitch)return false;

    const switched=await autoSwitchToNewestLiveSession(endedId);

    if(!switched){
      currentSession='';
      notice(
        `✅ ${endedTitle} 所有棋盤均已真正結束；目前沒有其他進行中的指導棋。`,
        'good'
      );
    }
    return switched;
  }

  boards=nextBoards;
  $("frames").innerHTML='';

  const live=activeBoards();
  activeSlot=
    live.find(b=>b.room_turn==='W')?.slot_no ||
    live[0].slot_no;

  renderTabs();
  activate(activeSlot);
  await subscribeRooms();

  notice(`✅ 已開啟 ${boards[0].title}，進行中 ${live.length} 盤。`,'good');
  return true;
}

async function cleanupOldSessions(){
  if(!confirm('將封存超過 3 小時沒有更新的舊指導棋場次，並清除 0 盤空場次。\n\n棋局、online_rooms、落子紀錄與棋譜都不會刪除。\n目前仍有近期更新的棋局不會處理。\n\n確定清理嗎？'))return;
  notice('正在安全清理舊場次…');
  const {data:stale,error:e1}=await sb.rpc('joygo_guidance_archive_stale_sessions',{p_stale_hours:3});
  if(e1)return notice('清理失敗：'+e1.message,'bad');
  const {data:empty,error:e2}=await sb.rpc('joygo_guidance_cleanup_empty_sessions');
  if(e2)return notice('空場次清理失敗：'+e2.message,'bad');
  const a=Number(stale||0), b=Number(empty||0);
  await loadSessions();
  notice((a+b)>0?`✅ 已封存 ${a} 個舊場次、清除 ${b} 個 0 盤空場次；棋譜均保留。`:'✅ 目前沒有需要清理的舊場次。','good')
}
$("cleanupBtn").onclick=cleanupOldSessions;
async function init(){try{const {data,error}=await sb.auth.getSession();if(error||!data?.session)return notice('請先回 Joy Go Platform 登入主管理員帳號。','bad');me=data.session.user;const {data:access,error:ae}=await sb.rpc('joygo_get_staff_access');if(ae)return notice('無法檢查管理權限：'+ae.message,'bad');const a=Array.isArray(access)?access[0]:access;if(!a||a.staff_role==='none')return notice('此頁只開放授權工作人員使用。','bad');await loadProfiles();await loadSessions();syncTeacherIdentityUI();notice('✅ 多人指導棋系統已就緒｜可切換朱老師／棋王 SAI。','good')}catch(e){notice('初始化失敗：'+(e.message||e),'bad')}}
init();setInterval(()=>refreshSession(false),5000);
</script></body></html>
