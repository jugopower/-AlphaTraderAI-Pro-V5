<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joy Go｜多人線上指導棋</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f0e6;--card:#fffdf8;--ink:#2d251c;--line:#d8c7a7;--gold:#9a6a21;--red:#c83a32;--green:#287a50}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7f3eb,#efe6d7);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:50;background:#2b2117;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px #0003}header h1{font-size:20px;margin:0;flex:1}.tag{font-size:12px;opacity:.8}
.wrap{max-width:1280px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid #dfd3bd;border-radius:16px;box-shadow:0 8px 24px #4b3b2210;margin-bottom:14px;overflow:hidden}.card h2{font-size:17px;margin:0;padding:12px 14px;background:#eadfc9}.body{padding:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#5d4934;color:white}.gold{background:var(--gold)}.red{background:var(--red)}.green{background:var(--green)}.ghost{background:#fff;color:#4d3c2a;border:1px solid var(--line)}
.notice{padding:10px 12px;border-radius:10px;background:#f2eadb;margin-bottom:12px}.good{background:#e4f3e9;color:#1d653d}.bad{background:#fde7e5;color:#9c2b26}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar select,.toolbar input{padding:9px;border:1px solid var(--line);border-radius:9px;background:white}.formgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.student-row{border:1px solid var(--line);border-radius:12px;padding:10px;background:white}.student-row b{display:block;margin-bottom:7px}.student-row select,.student-row input{width:100%;padding:8px;border:1px solid #ccb997;border-radius:8px;margin-top:6px;background:white}
.tabs-wrap{position:sticky;top:60px;z-index:40;background:#f7f1e6;padding-top:8px}.tabs{display:flex;gap:5px;overflow-x:auto;padding:0 2px 7px}.tab{min-width:150px;border:1px solid #cbb994;background:#fffaf0;border-radius:12px 12px 4px 4px;padding:9px 10px;text-align:left;cursor:pointer;position:relative}.tab.active{background:#3b2d1f;color:white;border-color:#3b2d1f}.tab.wait-teacher:not(.active){border:2px solid var(--red);background:#fff1ef}.tab.wait-teacher:after{content:"";width:10px;height:10px;background:var(--red);border-radius:50%;position:absolute;right:7px;top:7px}.tab.done{opacity:.65}.tab-name{font-weight:800}.tab-meta{font-size:12px;margin-top:3px;opacity:.8}
.controlbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.current{font-weight:800;flex:1}.board-frame{width:100%;height:760px;border:1px solid #bda984;border-radius:14px;background:white;display:none}.board-frame.active{display:block}.empty{padding:36px;text-align:center;color:#796a58}.session-list{display:flex;gap:8px;flex-wrap:wrap}.session-chip{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:white;cursor:pointer}.small{font-size:12px;color:#7e6c58}
@media(max-width:900px){.formgrid{grid-template-columns:1fr 1fr}.board-frame{height:700px}}@media(max-width:560px){.formgrid{grid-template-columns:1fr}.tab{min-width:132px}.board-frame{height:650px}header h1{font-size:17px}}
</style>
</head>
<body>
<header><div><h1>🎓 Joy Go 多人線上指導棋</h1><div class="tag">Beta 2.8.6｜書籤式 1 對 1～1 對 5｜舊場次清理＋列表修正</div></div><button class="btn ghost" onclick="location.href='admin-center.html'">回管理中心</button></header>
<div class="wrap">
<div id="notice" class="notice">正在確認登入狀態…</div>
<section class="card"><h2>建立新的指導棋</h2><div class="body"><div class="toolbar" style="margin-bottom:12px">
<label>名稱 <input id="title" value="朱老師線上指導棋"></label><label>人數 <select id="studentCount"><option value="1">1 對 1</option><option value="2">1 對 2</option><option value="3">1 對 3</option><option value="4">1 對 4</option><option value="5">1 對 5</option></select></label>
<label>基本時間(分) <input id="mainMin" type="number" value="20" min="0" style="width:80px"></label><label>讀秒(秒) <input id="byoSec" type="number" value="30" min="5" style="width:76px"></label><label>次數 <input id="byoPeriods" type="number" value="3" min="1" style="width:60px"></label></div>
<div id="studentRows" class="formgrid"></div><div class="toolbar" style="margin-top:12px"><button id="createBtn" class="btn green">建立指導棋</button><span class="small">老師固定執白；學生執黑。讓 2～9 子會自動放置標準讓子。</span></div></div></section>
<section class="card"><h2>進行中的指導棋</h2><div class="body"><div class="toolbar" style="margin-bottom:10px"><button id="cleanupBtn" class="btn ghost">清理舊場次</button><span class="small">只顯示真正近期進行中的場次；舊測試場次只封存、不刪棋譜。</span></div><div id="sessions" class="session-list">讀取中…</div></div></section>
<section class="card"><h2>老師書籤總控</h2><div class="body"><div class="tabs-wrap"><div id="tabs" class="tabs"></div></div><div id="controlbar" class="controlbar" style="display:none"><div id="currentInfo" class="current">—</div><label><input type="checkbox" id="autoNext" checked> 自動下一盤</label><button id="nextBtn" class="btn gold">下一盤 🔴</button><button id="copyBtn" class="btn ghost">複製學生連結</button><button id="refreshBtn" class="btn ghost">重新整理</button><button id="endBtn" class="btn red">結束整場</button></div><div id="frames"><div class="empty">請先建立或開啟一場指導棋。</div></div></div></section>
</div>
<script>
const CFG={url:"https://kpwfkmkxtrwmlxhomaxy.supabase.co",key:"sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr"};
const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);let me=null,profiles=[],currentSession="",boards=[],activeSlot=1,roomChannel=null;
function notice(t,k=""){const n=$("notice");n.textContent=t;n.className="notice"+(k?" "+k:"")}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function profileOptions(sel=""){return '<option value="">選擇學生</option>'+profiles.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.display_name||'會員')}</option>`).join('')}
function renderStudentRows(){const n=Number($("studentCount").value||1),box=$("studentRows");const old=[...box.querySelectorAll('.student-row')].map(r=>({id:r.querySelector('.student')?.value||'',rank:r.querySelector('.rank')?.value||'',h:r.querySelector('.handicap')?.value||'0'}));box.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('div');d.className='student-row';d.innerHTML=`<b>學生 ${i+1}</b><select class="student">${profileOptions(old[i]?.id||'')}</select><input class="rank" placeholder="棋力，例如 3段" value="${esc(old[i]?.rank||'')}"><select class="handicap"><option value="0">分先</option>${[2,3,4,5,6,7,8,9].map(x=>`<option value="${x}" ${String(x)===old[i]?.h?'selected':''}>讓 ${x} 子</option>`).join('')}</select>`;box.appendChild(d)}}
$("studentCount").onchange=renderStudentRows;
async function loadProfiles(){const {data,error}=await sb.from('profiles').select('id,display_name,role,status').order('display_name');if(error)throw error;profiles=(data||[]).filter(p=>p.id!==me.id&&String(p.status||'').toLowerCase()!=='suspended');renderStudentRows()}
async function loadSessions(){
  const {data,error}=await sb.rpc('joygo_guidance_live_sessions');
  if(error){$("sessions").textContent='讀取失敗：'+error.message;return}
  const rows=(data||[]).filter(s=>Number(s.live_count||0)>0);
  $("sessions").innerHTML=rows.length
    ?rows.map(s=>`<button class="session-chip" data-id="${s.session_id}">${esc(s.title)}｜${s.live_count}/${s.student_count}盤進行中</button>`).join('')
    :'<span class="small">目前沒有進行中的指導棋。</span>';
  document.querySelectorAll('.session-chip').forEach(b=>b.onclick=()=>openSession(b.dataset.id))
}
async function createSession(){const rows=[...document.querySelectorAll('.student-row')],students=[],used=new Set();for(let i=0;i<rows.length;i++){const id=rows[i].querySelector('.student').value;if(!id)return notice(`請選擇學生 ${i+1}`,'bad');if(used.has(id))return notice('同一位學生不能重複加入','bad');used.add(id);const p=profiles.find(x=>x.id===id);students.push({user_id:id,name:p?.display_name||`學生${i+1}`,rank:rows[i].querySelector('.rank').value.trim(),handicap:Number(rows[i].querySelector('.handicap').value||0)})}notice('正在建立 1 對 '+students.length+' 指導棋…');const {data,error}=await sb.rpc('joygo_guidance_create_session',{p_title:$("title").value.trim()||'線上指導棋',p_students:students,p_main_seconds:Math.max(0,Number($("mainMin").value||20)*60),p_byo_seconds:Math.max(5,Number($("byoSec").value||30)),p_byo_periods:Math.max(1,Number($("byoPeriods").value||3))});if(error)return notice('建立失敗：'+error.message,'bad');if(!data?.length)return notice('建立完成但沒有取得棋盤資料','bad');notice(`✅ 已建立 1 對 ${data.length} 指導棋。`,'good');await loadSessions();await openSession(data[0].session_id)}
$("createBtn").onclick=createSession;
function tabLabel(b){return b.tab_status==='ended'?'✅ 已結束':b.tab_status==='waiting_teacher'?'🔴 等老師':'🟢 學生思考'}
function activeBoards(){return boards.filter(b=>b.tab_status!=='ended')}
function renderTabs(){const live=activeBoards();$("tabs").innerHTML=live.map(b=>`<button class="tab ${b.slot_no===activeSlot?'active':''} ${b.tab_status==='waiting_teacher'?'wait-teacher':''}" data-slot="${b.slot_no}"><div class="tab-name">${esc(b.student_name)} ${esc(b.student_rank||'')}</div><div class="tab-meta">${tabLabel(b)}｜${b.handicap?`讓${b.handicap}子`:'分先'}｜${esc(b.room_code)}</div></button>`).join('');document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>activate(Number(t.dataset.slot)))}
function ensureFrame(b){let f=document.getElementById('frame-'+b.slot_no);if(!f){const e=$("frames").querySelector('.empty');if(e)e.remove();f=document.createElement('iframe');f.id='frame-'+b.slot_no;f.className='board-frame';f.dataset.src=`index.html?room=${encodeURIComponent(b.room_code)}&guidance_embed=1&gv=286`;$("frames").appendChild(f)}if(!f.getAttribute('src'))f.src=f.dataset.src;return f}
function activate(slot){const live=activeBoards();if(!live.length){clearTeacherControl();return}const chosen=live.find(b=>b.slot_no===slot)||live[0];activeSlot=chosen.slot_no;live.forEach(b=>ensureFrame(b).classList.toggle('active',b.slot_no===activeSlot));renderTabs();renderCurrent()}
function clearTeacherControl(){document.querySelectorAll('.board-frame').forEach(f=>f.remove());$("tabs").innerHTML='';$("controlbar").style.display='none';$("frames").innerHTML='<div class="empty">✅ 本場棋局已結束，棋盤與標籤已自動清除；棋譜紀錄仍保留。</div>'}
function removeEndedFrames(){boards.filter(b=>b.tab_status==='ended').forEach(b=>document.getElementById('frame-'+b.slot_no)?.remove())}
function renderCurrent(){const b=boards.find(x=>x.slot_no===activeSlot);if(!b)return;$("controlbar").style.display='flex';$("currentInfo").textContent=`第 ${b.slot_no} 盤｜${b.student_name} ${b.student_rank||''}｜${tabLabel(b)}｜房號 ${b.room_code}`;$("autoNext").checked=!!b.auto_next}
function nextWaitingTeacher(){const o=activeBoards().sort((a,b)=>a.slot_no-b.slot_no);if(!o.length){clearTeacherControl();return false}const start=Math.max(0,o.findIndex(x=>x.slot_no===activeSlot));for(let k=1;k<=o.length;k++){const b=o[(start+k)%o.length];if(b.tab_status==='waiting_teacher'){activate(b.slot_no);return true}}notice('目前沒有其他等待老師落子的棋盤。');return false}
$("nextBtn").onclick=nextWaitingTeacher;$("refreshBtn").onclick=()=>refreshSession(true);$("copyBtn").onclick=async()=>{const b=boards.find(x=>x.slot_no===activeSlot);if(!b)return;const u=new URL('index.html',location.href);u.searchParams.set('room',b.room_code);const text=`Joy Go 指導棋｜${b.student_name}\n房號：${b.room_code}\n${u.href}`;try{await navigator.clipboard.writeText(text);notice('✅ 學生連結已複製','good')}catch{prompt('請複製學生連結：',text)}};
$("autoNext").onchange=async e=>{if(!currentSession)return;const {error}=await sb.rpc('joygo_guidance_set_auto_next',{p_session_id:currentSession,p_enabled:e.target.checked});if(error)notice('設定失敗：'+error.message,'bad');else boards.forEach(b=>b.auto_next=e.target.checked)};
$("endBtn").onclick=async()=>{if(!currentSession||!confirm('確定結束整場指導棋？棋局與棋譜不會刪除。'))return;const {error}=await sb.rpc('joygo_guidance_end_session',{p_session_id:currentSession});if(error)return notice('結束失敗：'+error.message,'bad');notice('✅ 本場指導棋已標示結束。','good');await loadSessions();await refreshSession(true)};
async function refreshSession(manual=false){if(!currentSession)return;const prev=new Map(boards.map(b=>[b.room_id,b.tab_status]));const {data,error}=await sb.rpc('joygo_guidance_get_session',{p_session_id:currentSession});if(error){if(manual)notice('更新失敗：'+error.message,'bad');return}boards=data||[];removeEndedFrames();const live=activeBoards();if(!live.length){
  clearTeacherControl();
  try{
    await sb.rpc('joygo_guidance_mark_ended_if_complete',{p_session_id:currentSession});
  }catch(e){}
  if(manual)notice('✅ 本場所有棋盤均已完局；棋盤與標籤已清除，棋譜仍保留。','good');
  await loadSessions();
  return
}const a=live.find(b=>b.slot_no===activeSlot)||live.find(b=>b.tab_status==='waiting_teacher')||live[0];activeSlot=a.slot_no;renderTabs();renderCurrent();const cur=boards.find(b=>b.slot_no===activeSlot),old=cur?prev.get(cur.room_id):null;if(cur&&cur.auto_next&&old==='waiting_teacher'&&cur.tab_status==='waiting_student')setTimeout(nextWaitingTeacher,250);if(manual)notice('✅ 指導棋狀態已更新','good')}
async function subscribeRooms(){if(roomChannel){try{await sb.removeChannel(roomChannel)}catch{}}roomChannel=sb.channel('joygo-guidance-'+currentSession).on('postgres_changes',{event:'*',schema:'public',table:'online_rooms'},()=>refreshSession(false)).subscribe()}
async function openSession(id){
  currentSession=id;
  const {data,error}=await sb.rpc('joygo_guidance_get_session',{p_session_id:id});
  if(error)return notice('開啟失敗：'+error.message,'bad');
  boards=data||[];
  if(!boards.length){
    currentSession='';
    clearTeacherControl();
    await loadSessions();
    notice('已略過空白指導棋場次；有效棋局仍保留。','good');
    return
  }
  $("frames").innerHTML='';
  const live=activeBoards();
  if(!live.length){
    clearTeacherControl();
    try{
      await sb.rpc('joygo_guidance_mark_ended_if_complete',{p_session_id:currentSession});
    }catch(e){}
    await loadSessions();
    notice(`✅ ${boards[0].title} 所有棋盤均已結束；棋盤與標籤已清除，棋譜仍保留。`,'good');
    return
  }
  activeSlot=live.find(b=>b.tab_status==='waiting_teacher')?.slot_no||live[0].slot_no;
  renderTabs();activate(activeSlot);await subscribeRooms();
  notice(`✅ 已開啟 ${boards[0].title}，進行中 ${live.length} 盤。`,'good')
}
async function cleanupOldSessions(){
  if(!confirm('將封存超過 3 小時沒有更新的舊指導棋場次，並清除 0 盤空場次。\n\n棋局、online_rooms、落子紀錄與棋譜都不會刪除。\n目前仍有近期更新的棋局不會處理。\n\n確定清理嗎？'))return;
  notice('正在安全清理舊場次…');
  const {data:stale,error:e1}=await sb.rpc('joygo_guidance_archive_stale_sessions',{p_stale_hours:3});
  if(e1)return notice('清理失敗：'+e1.message,'bad');
  const {data:empty,error:e2}=await sb.rpc('joygo_guidance_cleanup_empty_sessions');
  if(e2)return notice('空場次清理失敗：'+e2.message,'bad');
  const a=Number(stale||0), b=Number(empty||0);
  await loadSessions();
  notice((a+b)>0?`✅ 已封存 ${a} 個舊場次、清除 ${b} 個 0 盤空場次；棋譜均保留。`:'✅ 目前沒有需要清理的舊場次。','good')
}
$("cleanupBtn").onclick=cleanupOldSessions;
async function init(){try{const {data,error}=await sb.auth.getSession();if(error||!data?.session)return notice('請先回 Joy Go Platform 登入主管理員帳號。','bad');me=data.session.user;const {data:access,error:ae}=await sb.rpc('joygo_get_staff_access');if(ae)return notice('無法檢查管理權限：'+ae.message,'bad');const a=Array.isArray(access)?access[0]:access;if(!a||a.staff_role==='none')return notice('目前 Beta 2.7.2 只開放主管理員／工作人員使用。','bad');await loadProfiles();await loadSessions();notice('✅ 多人指導棋系統已就緒。','good')}catch(e){notice('初始化失敗：'+(e.message||e),'bad')}}
init();setInterval(()=>refreshSession(false),5000);
</script></body></html>
