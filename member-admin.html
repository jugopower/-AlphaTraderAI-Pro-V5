<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100b">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  connect-src 'self' https://*.supabase.co wss://*.supabase.co;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Joy Go Beta 3.3.3a｜會員棋力與戰績管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07100b;--panel:#0e1912;--line:#365543;--gold2:#ffe184;--ink:#fff9e8;--muted:#b9c5bb;--green:#55d69a;--red:#ff8c8c;--blue:#83cfff}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(circle at 90% 0,#183b28 0,transparent 35%),linear-gradient(145deg,#050907,#0b1b11);color:var(--ink)}
.shell{width:min(1400px,100%);margin:auto;padding:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand h1{margin:0;color:var(--gold2);font-size:clamp(26px,4vw,40px)}.brand p{margin:5px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#0b140e;color:var(--ink);padding:10px 13px;border-radius:12px;font-weight:850;text-decoration:none;cursor:pointer}
.btn.gold{border:0;background:linear-gradient(135deg,#ffe185,#d99b23);color:#211400}
.notice{padding:12px 14px;border:1px solid var(--line);border-radius:13px;color:var(--muted);margin-bottom:12px;background:#0b130e}
.notice.good{border-color:#257657;color:#9cebc7}.notice.bad{border-color:#914343;color:#ffb0b0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px}
.stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,#14251a,#0a110d)}
.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{display:block;font-size:26px;color:var(--gold2);margin-top:4px}
.card{border:1px solid var(--line);border-radius:18px;background:#0b130e;overflow:hidden}.card h2{margin:0;padding:15px 16px;border-bottom:1px solid #293d31;color:#ffe083;font-size:20px}.body{padding:14px}
.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin-bottom:10px}
.filters input,.filters select,select,input[type=date]{background:#050806;border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px}
.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;min-width:1500px}
th,td{padding:10px;border-bottom:1px solid #26362c;text-align:left;vertical-align:middle;font-size:13px}th{background:#18261d;color:#ffe083;position:sticky;top:0}
.name{font-weight:900;font-size:14px}.sub{color:var(--muted);font-size:12px;line-height:1.45}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.ok{background:#10472f;color:#90efbd}.badpill{background:#542626;color:#ffb0b0}.bluepill{background:#193b51;color:#a8ddff}
.mini{border:0;border-radius:8px;padding:7px 9px;font-weight:850;cursor:pointer}.save{background:var(--green);color:#082317}.wait{background:var(--blue);color:#092337}.reject{background:var(--red);color:#3b0808}.neutral{background:#d9bb76;color:#2d2008}
.ops{display:flex;gap:5px;flex-wrap:wrap;min-width:260px}
.team{margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,#112219,#0a120d);padding:12px 14px}
.team-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.team-head b{color:var(--gold2);font-size:17px}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.team-item{border:1px solid #294235;border-radius:11px;padding:9px 10px;background:#09110c}.team-item span{display:block;color:var(--muted);font-size:11px}
.team-item strong{display:block;margin-top:3px;font-size:13px}.stafftag{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:999px;background:#423516;color:#ffe19a;font-size:11px;font-weight:850}
.rankbox{display:flex;gap:6px;align-items:center;min-width:180px}.rankbox select{min-width:90px}
.record{white-space:nowrap;font-weight:800}.record small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
@media(max-width:900px){.team-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.shell{padding:10px}.head{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<header class="head">
  <div class="brand">
    <h1>👥 Joy Go 會員管理</h1>
    <p>Beta 3.3.3a｜棋力下拉選單＋升降賽戰績</p>
  </div>
  <div class="actions">
    <button id="refreshBtn" class="btn">重新整理</button>
    <a class="btn" href="admin-center.html">返回管理中心</a>
    <a class="btn gold" href="index.html">返回平台</a>
  </div>
</header>

<div id="notice" class="notice">正在確認管理員身分…</div>

<section id="app" hidden>
  <div class="stats">
    <div class="stat"><span>全部會員</span><b id="mTotal">0</b></div>
    <div class="stat"><span>正式會員</span><b id="mMember">0</b></div>
    <div class="stat"><span>試用會員</span><b id="mTrial">0</b></div>
    <div class="stat"><span>停權</span><b id="mSusp">0</b></div>
    <div class="stat"><span>可參賽</span><b id="mEligible">0</b></div>
  </div>

  <section class="team">
    <div class="team-head"><b>🛡️ 管理團隊</b><span class="sub">主管理員與副管理員均可調整會員棋力</span></div>
    <div class="team-grid">
      <div class="team-item"><span>主管理員</span><strong id="teamAdmin">—</strong></div>
      <div class="team-item"><span>副管理員</span><strong id="teamDeputy">—</strong></div>
      <div class="team-item"><span>匿名巡場員 01</span><strong id="teamMod1">—</strong></div>
      <div class="team-item"><span>匿名巡場員 02</span><strong id="teamMod2">—</strong></div>
    </div>
  </section>

  <section class="card">
    <h2>會員資料與權限</h2>
    <div class="body">
      <div class="filters">
        <input id="memberSearch" placeholder="搜尋姓名或 Email">
        <select id="roleFilter"><option value="all">全部身分</option><option value="member">正式會員</option><option value="trial">試用會員</option><option value="admin">管理員</option></select>
        <select id="statusFilter"><option value="all">全部狀態</option><option value="active">正常</option><option value="suspended">停權</option></select>
        <select id="competitionFilter"><option value="all">全部參賽資格</option><option value="eligible">可參賽</option><option value="blocked">不可參賽</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>會員</th><th>身分</th><th>棋力</th><th>升降賽戰績</th><th>狀態</th>
            <th>試用／會員到期</th><th>加入會員時間</th><th>最近登入</th><th>參賽資格</th><th>管理處置</th>
          </tr></thead>
          <tbody id="memberRows"><tr><td colspan="10" class="sub">讀取中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</section>
</main>

<script>
const CFG={url:"https://kpwfkmkxtrwmlxhomaxy.supabase.co",key:"sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr"};
const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me=null,members=[],rankRows=new Map(),staffRole="none",deputyIds=new Set(),moderatorIds=new Set();

function notice(msg,type=""){ $("notice").className="notice"+(type?(" "+type):""); $("notice").textContent=msg; }
function fmt(ts){if(!ts)return "—";try{return new Date(ts).toLocaleString("zh-TW",{hour12:false})}catch{return String(ts)}}
function memberNameById(id){const r=members.find(x=>x.id===id);return r?.display_name||r?.email||"—"}

async function loadStaffTeam(){
  deputyIds=new Set();moderatorIds=new Set();
  try{const {data}=await sb.rpc("joygo_get_deputy_ids");(data||[]).forEach(x=>deputyIds.add(x.user_id));}catch{}
  try{const {data}=await sb.rpc("joygo_get_moderator_ids");(data||[]).forEach(x=>moderatorIds.add(x.user_id));}catch{}
  const admin=members.find(x=>x.role==="admin");
  $("teamAdmin").textContent=admin?(admin.display_name||admin.email||"主管理員"):"—";
  const dep=[...deputyIds][0];$("teamDeputy").textContent=dep?memberNameById(dep):"尚未設定";
  const mods=[...moderatorIds];
  $("teamMod1").textContent=mods[0]?"已設定（匿名）":"尚未設定";
  $("teamMod2").textContent=mods[1]?"已設定（匿名）":"尚未設定";
}
function staffBadge(id){
  if(deputyIds.has(id))return '<span class="stafftag">副管理員</span>';
  if(moderatorIds.has(id))return '<span class="stafftag">匿名巡場員</span>';
  return '';
}

function rankCell(r){
  const rr=rankRows.get(r.id)||{};
  const label=rr.rank_label||"未設定";
  if(!["admin","deputy"].includes(staffRole))return esc(label);
  return `<div class="rankbox">
    <select class="rankSelect">
      <option value="">${esc(label)}</option>
      <option value="30K">30級</option><option value="29K">29級</option><option value="28K">28級</option><option value="27K">27級</option><option value="26K">26級</option><option value="25K">25級</option><option value="24K">24級</option><option value="23K">23級</option><option value="22K">22級</option><option value="21K">21級</option><option value="20K">20級</option><option value="19K">19級</option><option value="18K">18級</option><option value="17K">17級</option><option value="16K">16級</option><option value="15K">15級</option><option value="14K">14級</option><option value="13K">13級</option><option value="12K">12級</option><option value="11K">11級</option><option value="10K">10級</option><option value="9K">9級</option><option value="8K">8級</option><option value="7K">7級</option><option value="6K">6級</option><option value="5K">5級</option><option value="4K">4級</option><option value="3K">3級</option><option value="2K">2級</option><option value="1K">1級</option><option value="1D">初段</option><option value="2D">2段</option><option value="3D">3段</option><option value="4D">4段</option><option value="5D">5段</option><option value="6D">6段</option><option value="7D">7段</option>
    </select>
    <button class="mini save" onclick="saveRank('${r.id}')">儲存棋力</button>
  </div>`;
}
function recordCell(r){
  const rr=rankRows.get(r.id)||{};
  const w=Number(rr.rating_total_wins||0),l=Number(rr.rating_total_losses||0),n=w+l;
  const pct=n?Math.round(w*1000/n)/10:0;
  return `<div class="record">${w}勝 ${l}敗<small>勝率 ${pct}%</small></div>`;
}
async function saveRank(id){
  if(!["admin","deputy"].includes(staffRole))return notice("只有主管理員或副管理員可以修改棋力。","bad");
  const row=document.querySelector(`tr[data-id="${id}"]`);
  const sel=row?.querySelector(".rankSelect"),code=sel?.value;
  if(!code)return notice("請先選擇新的棋力。","bad");
  const m=members.find(x=>x.id===id),old=rankRows.get(id)?.rank_label||"未設定";
  const newLabel=sel.options[sel.selectedIndex]?.text||code;
  if(!confirm(`確定將「${m?.display_name||m?.email||"會員"}」由 ${old} 改為 ${newLabel}？`))return;
  const {error}=await sb.rpc("joygo_staff_set_member_rank_v333",{p_target_id:id,p_rank_code:code});
  if(error)return notice("棋力修改失敗："+error.message,"bad");
  notice(`✅ 棋力已修改：${old} → ${newLabel}。`,"good");
  await loadMembers();
}
window.saveRank=saveRank;

function renderMembers(){
  const q=$("memberSearch").value.trim().toLowerCase();
  const rf=$("roleFilter").value,sf=$("statusFilter").value,cf=$("competitionFilter").value;
  const arr=members.filter(x=>{
    const qok=!q||[x.display_name,x.email].join(" ").toLowerCase().includes(q);
    const rok=rf==="all"||x.role===rf;
    const sok=sf==="all"||x.status===sf;
    const eligible=x.competition_eligible!==false;
    const cok=cf==="all"||(cf==="eligible"&&eligible)||(cf==="blocked"&&!eligible);
    return qok&&rok&&sok&&cok;
  });
  $("mTotal").textContent=members.length;
  $("mMember").textContent=members.filter(x=>x.role==="member"&&x.status==="active").length;
  $("mTrial").textContent=members.filter(x=>x.role==="trial").length;
  $("mSusp").textContent=members.filter(x=>x.status==="suspended").length;
  $("mEligible").textContent=members.filter(x=>x.competition_eligible!==false&&x.status!=="suspended").length;

  $("memberRows").innerHTML=arr.map(r=>{
    const self=r.id===me.id,isAdmin=r.role==="admin",eligible=r.competition_eligible!==false;
    const roleText=isAdmin?"主管理員":deputyIds.has(r.id)?"副管理員":r.role==="trial"?"試用會員":"正式會員";
    return `<tr data-id="${r.id}">
      <td><div class="name">${esc(r.display_name||"未命名")}${self?"（我）":""}</div><div class="sub">${esc(r.email||"")}</div>${staffBadge(r.id)}</td>
      <td>${roleText}</td>
      <td>${rankCell(r)}</td>
      <td>${recordCell(r)}</td>
      <td><span class="pill ${r.status==="suspended"?"badpill":"ok"}">${r.status==="suspended"?"停權":"正常"}</span></td>
      <td>${r.expires_at?fmt(r.expires_at):"—"}</td>
      <td>${r.created_at?fmt(r.created_at):"—"}</td>
      <td>${r.last_sign_in_at?fmt(r.last_sign_in_at):"—"}</td>
      <td><span class="pill ${eligible?"bluepill":"badpill"}">${eligible?"可參賽":"不可參賽"}</span></td>
      <td>${self||isAdmin?'<span class="sub">不可處置</span>':`<div class="ops"><button class="mini wait" onclick="moderateMember('${r.id}','suspend_1d')">停1天</button><button class="mini save" onclick="moderateMember('${r.id}','unsuspend')">解除</button></div>`}</td>
    </tr>`;
  }).join("")||'<tr><td colspan="10" class="sub">沒有符合資料。</td></tr>';
}
async function moderateMember(id,action){
  const r=members.find(x=>x.id===id);if(!r)return;
  if(!confirm(`確定對「${r.display_name||r.email}」執行此處置？`))return;
  const {error}=await sb.rpc("joygo_admin_moderate_member",{p_target_user:id,p_action:action,p_reason:""});
  if(error)return notice("會員處置失敗："+error.message,"bad");
  notice("✅ 會員狀態已更新。","good");await loadMembers();
}
window.moderateMember=moderateMember;

async function loadMembers(){
  const [mres,rres]=await Promise.all([
    sb.rpc("joygo_admin_member_list",{p_limit:500}),
    sb.rpc("joygo_staff_list_member_ranks_v333")
  ]);
  if(mres.error)return notice("會員資料讀取失敗："+mres.error.message,"bad");
  if(rres.error)return notice("棋力資料讀取失敗："+rres.error.message,"bad");
  members=mres.data||[];
  rankRows=new Map((rres.data||[]).map(x=>[x.user_id,x]));
  await loadStaffTeam();
  renderMembers();
}
async function init(){
  const {data:{session},error}=await sb.auth.getSession();
  if(error||!session)return notice("請先登入 Joy Go 管理員帳號。","bad");
  me=session.user;
  const {data:access,error:ae}=await sb.rpc("joygo_get_staff_access");
  if(ae)return notice("管理權限讀取失敗："+ae.message,"bad");
  const a=Array.isArray(access)?access[0]:access;
  staffRole=a?.staff_role||"none";
  if(!["admin","deputy","moderator"].includes(staffRole))return notice("此頁僅限管理團隊使用。","bad");
  $("app").hidden=false;
  notice(staffRole==="admin"?"✅ 主管理員會員管理已就緒。":staffRole==="deputy"?"✅ 副管理員會員管理已就緒。":"✅ 巡場會員監控已就緒。","good");
  await loadMembers();
}
["memberSearch","roleFilter","statusFilter","competitionFilter"].forEach(id=>$(id).addEventListener(id==="memberSearch"?"input":"change",renderMembers));
$("refreshBtn").onclick=loadMembers;
init();
</script>
</body>
</html>
