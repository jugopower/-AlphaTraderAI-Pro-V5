<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>會員管理｜Joy Go Platform</title>
<style>:root{--ink:#173b38;--jade:#277568;--paper:#f6f1e7;--line:#cfd9d5;--red:#a33434}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#edf4f0;color:var(--ink)}header{padding:20px max(18px,calc((100% - 1080px)/2));background:#153f3a;color:white;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0;font-size:25px}header a{color:#173b38;background:#f0dba8;padding:10px 13px;border-radius:10px;text-decoration:none;font-weight:800}main{max-width:1080px;margin:24px auto;padding:0 18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:15px}.card b{display:block;font-size:27px;margin-top:5px}.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px}.toolbar button,button.save{border:0;border-radius:10px;padding:11px 15px;background:var(--jade);color:white;font-weight:800}.message{min-height:24px;margin:8px 0;color:#47655f}.message.error{color:var(--red)}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:12px 10px;border-bottom:1px solid #e5ebe8;text-align:left;vertical-align:middle}th{background:#f7f4eb;position:sticky;top:0}select,input[type=date]{padding:9px;border:1px solid #bacbc5;border-radius:9px;background:white}.role{font-weight:800}.empty{text-align:center;padding:35px}.danger{color:var(--red)}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}header h1{font-size:20px}}</style></head>
<body><header><h1>Joy Go 會員管理</h1><a href="joygo-auth.html">返回會員中心</a></header><main>
<section class="summary"><div class="card">全部會員<b id="total">—</b></div><div class="card">正式會員<b id="members">—</b></div><div class="card">試用會員<b id="trials">—</b></div><div class="card">停用會員<b id="suspended">—</b></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="搜尋姓名或 Email"><button id="refresh" type="button">重新整理</button></div><p id="message" class="message" aria-live="polite">正在確認管理員權限…</p>
<div class="table-wrap"><table><thead><tr><th>會員</th><th>角色</th><th>狀態</th><th>到期日</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">載入中…</td></tr></tbody></table></div>
</main><script type="module" src="joygo-admin.js"></script></body></html>
