<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>會員管理｜Joy Go Platform</title>
  <style>
    :root{color-scheme:dark;--bg:#080b0d;--panel:#15110e;--panel2:#21170f;--gold:#f2bd43;--gold2:#ffd871;--ink:#fff8e8;--muted:#c8b99c;--line:#76501f;--green:#4ed19a;--red:#ff7979;--blue:#70b7ff}*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at 80% 0,#3a210d 0,transparent 35%),linear-gradient(145deg,#07090b,#130d08)}button,select,input{font:inherit}.shell{width:min(1180px,100%);margin:auto;padding:22px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}.title h1{margin:0;font-size:clamp(25px,4vw,38px);color:var(--gold2)}.title p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid var(--line);border-radius:13px;padding:11px 15px;background:#1b130e;color:var(--ink);font-weight:800;text-decoration:none}.button.gold{background:linear-gradient(135deg,var(--gold2),#d89418);color:#211300;border:0}.button:disabled{opacity:.45}.notice{margin:12px 0;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#17100b;color:var(--muted)}.notice.error{border-color:#8e3535;color:#ffaaaa}.notice.success{border-color:#297657;color:#9af0c8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(160deg,#24170d,#120e0b)}.stat span{display:block;color:var(--muted);font-size:13px}.stat b{display:block;margin-top:5px;color:var(--gold2);font-size:28px}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#100d0b;box-shadow:0 20px 50px #0007}.toolbar{display:flex;gap:10px;padding:14px;border-bottom:1px solid #4f381d}.toolbar input{flex:1;min-width:0;border:1px solid #60431f;border-radius:12px;padding:11px 13px;background:#070707;color:var(--ink)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:13px 12px;text-align:left;border-bottom:1px solid #332719;vertical-align:middle}th{position:sticky;top:0;background:#21170f;color:var(--gold2);font-size:13px}td{font-size:14px}.member-name{font-weight:850}.email{color:var(--muted)}.me{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#62420f;color:#ffe09a;font-size:11px}.role,.status,.date{width:100%;border:1px solid #684820;border-radius:9px;padding:8px;background:#090909;color:var(--ink)}.save{border:0;border-radius:10px;padding:9px 13px;background:var(--gold);color:#231400;font-weight:900}.save:disabled{opacity:.4}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:800;font-size:12px}.pill.admin{background:#694915;color:#ffe39d}.pill.active{background:#123f31;color:#76e4b7}.pill.suspended{background:#512323;color:#ffaaaa}.empty{text-align:center;padding:38px;color:var(--muted)}footer{padding:16px 3px;color:#8e806a;font-size:12px}@media(max-width:720px){.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.stat b{font-size:23px}.toolbar{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="title"><h1>👑 會員管理中心</h1><p>Joy Go Platform｜朱老師管理員專用</p></div>
      <div class="actions"><button id="refresh" class="button" type="button">重新整理</button><a class="button" href="./joygo-auth.html">會員中心</a><a class="button gold" href="./index.html">返回棋盤</a></div>
    </header>
    <div id="notice" class="notice">正在確認管理員身分…</div>
    <section id="content" hidden>
      <div class="stats">
        <div class="stat"><span>全部會員</span><b id="total">0</b></div>
        <div class="stat"><span>正式會員</span><b id="members">0</b></div>
        <div class="stat"><span>試用會員</span><b id="trials">0</b></div>
        <div class="stat"><span>停權會員</span><b id="suspended">0</b></div>
      </div>
      <section class="card">
        <div class="toolbar"><input id="search" type="search" placeholder="搜尋姓名或 Email"><button id="clearSearch" class="button" type="button">清除</button></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>會員</th><th>身分</th><th>狀態</th><th>到期日</th><th>建立日期</th><th>操作</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div id="empty" class="empty" hidden>目前沒有符合的會員。</div>
        </div>
      </section>
    </section>
    <footer>安全設計：一般會員無法讀取此名單；變更由 Supabase RLS 管理員政策保護。</footer>
  </main>
  <script type="module" src="./joygo-admin.js"></script>
</body>
</html>
