<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>比賽報名｜Joy Go Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07110d;--panel:#102019;--panel2:#182d23;--gold:#f4c24d;--gold2:#ffe08a;--ink:#f7f2df;--muted:#bfcabe;--line:#365844;--green:#55d89c;--red:#ff8d8d;--blue:#7ec8ff}*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 0,#224a36 0,transparent 34%),linear-gradient(145deg,#050b08,#102118)}button,input,select{font:inherit}.shell{width:min(940px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand h1{margin:0;color:var(--gold2);font-size:clamp(26px,5vw,40px)}.brand p{margin:5px 0;color:var(--muted)}.back{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:12px}.hero,.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,#173024dd,#0d1712ee);box-shadow:0 18px 45px #0006}.hero{margin:18px 0;padding:20px}.hero-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.metric{background:#09130e;border:1px solid #294d39;border-radius:14px;padding:13px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;margin-top:5px;color:var(--gold2);font-size:20px}.status{padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:#0a1510;color:var(--muted);margin:14px 0}.status.good{border-color:#267a55;color:#86e9bc}.status.bad{border-color:#8d3f3f;color:#ffb0b0}.card{padding:20px}.section-title{margin:0 0 14px;color:var(--gold2)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:800;font-size:13px}input,select{display:block;width:100%;margin-top:6px;border:1px solid #42654e;border-radius:11px;padding:12px;background:#07100c;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--gold)}.full{grid-column:1/-1}.rules{margin:15px 0;padding:14px;border:1px dashed #526a58;border-radius:13px;color:#d8dfd8;font-size:13px;line-height:1.6}.agree{display:flex;gap:9px;align-items:flex-start;font-weight:700}.agree input{width:20px;margin:2px 0 0}.submit{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#ffe084,#d89b23);color:#211400;font-weight:950;font-size:17px}.submit:disabled{opacity:.45}.my{margin-top:18px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px}.pending{background:#56451d;color:#ffe4a3}.approved{background:#124932;color:#83f0bd}.rejected{background:#5a2929;color:#ffb3b3}.waitlist{background:#153f5b;color:#a9ddff}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.player{padding:11px;border:1px solid #31533f;border-radius:12px;background:#0a1510}.small{color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:700px){.shell{padding:12px}.top{align-items:flex-start}.hero-grid,.grid{grid-template-columns:1fr}.players{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><h1>🏆 16 人網路圍棋賽</h1><p>Joy Go Platform｜報名與資格審核</p></div><a class="back" href="index.html">← 返回平台</a></header>
<section class="hero"><h2 id="eventTitle" style="margin-top:0">讀取比賽資訊…</h2><div class="hero-grid"><div class="metric"><span>比賽方式</span><b>線上初賽＋四強面棋</b></div><div class="metric"><span>名額</span><b id="slots">16 人</b></div><div class="metric"><span>報名費</span><b id="fee">—</b></div></div><p id="eventNote" class="small"></p></section>
<div id="status" class="status">正在確認會員登入狀態…</div>
<section id="formCard" class="card" hidden><h2 class="section-title">📝 選手報名資料</h2><div class="grid"><label>真實姓名<input id="realName" maxlength="50" autocomplete="name" placeholder="請填本人姓名"></label><label>手機號碼<input id="phone" maxlength="30" inputmode="tel" autocomplete="tel" placeholder="例如 0912-345-678"></label><label>棋力／段位<input id="rank" maxlength="30" placeholder="例如 5段、野狐6D"></label><label>常用網棋帳號<input id="goAccount" maxlength="80" placeholder="例如 野狐帳號（可填平台＋帳號）"></label><label>會員 Email<input id="email" disabled></label><label id="last5Wrap">匯款後五碼<input id="last5" maxlength="5" inputmode="numeric" pattern="[0-9]{5}" placeholder="5 位數字"></label><label id="paymentMethodWrap" class="full">付款方式<select id="paymentMethod" disabled><option>ATM／銀行轉帳（第一版）</option></select></label><div id="freeNotice" class="full status good" hidden style="margin:0">🎁 本場比賽免費，不需要填寫匯款後五碼。</div></div>
<div class="rules"><b>參賽聲明：</b><br>本人同意使用真實身分參賽；比賽期間不得使用 KataGo、AI 分析、他人提示或代打。主辦單位得依棋譜與比賽紀錄進行公平性查核；晉級四強者須依公告參加實體面棋決賽。</div><label class="agree"><input id="agree" type="checkbox"><span>我已閱讀並同意比賽規章與禁止 AI／代打條款。</span></label><button id="submit" class="submit" type="button" style="margin-top:15px">送出報名，等待審核</button></section>
<section id="myCard" class="card my" hidden><h2 class="section-title">🎫 我的報名狀態</h2><div id="myStatus"></div></section>
<section class="card my"><h2 class="section-title">✅ 已取得參賽資格</h2><div id="confirmed" class="players"><div class="small">讀取中…</div></div></section>
</main><script>
const CFG={url:"https://kpwfkmkxtrwmlxhomaxy.supabase.co",key:"sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr"};
const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const CODE="JOYGO16-001";let session=null,eventInfo=null,myReg=null;
const $=id=>document.getElementById(id);function msg(t,k=""){const e=$("status");e.className="status"+(k?" "+k:"");e.textContent=t}function esc(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const regLabel=s=>({pending:"⏳ 待審核",approved:"✅ 正式參賽",waitlist:"🟦 候補",rejected:"❌ 未通過",cancelled:"已取消"}[s]||s);const payLabel=s=>({pending:"待確認",paid:"已繳費／免繳",rejected:"付款有問題",refunded:"已退款"}[s]||s);const idLabel=s=>({pending:"待查核",verified:"已通過",rejected:"未通過"}[s]||s);
async function loadEvent(){const {data,error}=await sb.from("tournament_events").select("*").eq("code",CODE).single();if(error)throw error;eventInfo=data;const fee=Number(data.entry_fee||0);$("eventTitle").textContent=data.title;$("slots").textContent=data.max_players+" 人";$("fee").textContent=fee===0?"免費":"NT$ "+fee.toLocaleString();$("eventNote").textContent=(data.venue||"")+(data.note?"｜"+data.note:"");const free=fee===0;$("last5Wrap").hidden=free;$("paymentMethodWrap").hidden=free;$("freeNotice").hidden=!free;if(free)$("last5").value="00000"}
async function loadMine(){const {data,error}=await sb.from("tournament_registrations").select("*").eq("tournament_code",CODE).maybeSingle();if(error)throw error;myReg=data||null;if(!myReg){$("myCard").hidden=true;return}$("myCard").hidden=false;$("realName").value=myReg.real_name||"";$("phone").value=myReg.phone||"";$("rank").value=myReg.rank||"";$("goAccount").value=myReg.go_account||"";if(Number(eventInfo?.entry_fee||0)!==0)$("last5").value=myReg.payment_last5||"";const cls=myReg.registration_status;$("myStatus").innerHTML=`<p><span class="pill ${esc(cls)}">${esc(regLabel(cls))}</span></p><p><b>身分查核：</b>${esc(idLabel(myReg.identity_status))}　<b>報名費：</b>NT$ ${Number(myReg.payment_amount||0).toLocaleString()}　<b>付款：</b>${esc(payLabel(myReg.payment_status))}</p>${myReg.admin_note?`<p class="small"><b>管理員備註：</b>${esc(myReg.admin_note)}</p>`:""}<p class="small">送出時間：${new Date(myReg.created_at).toLocaleString("zh-TW")}</p>`;$("submit").textContent=cls==="approved"?"更新聯絡資料":"更新報名資料並重新送審"}
async function loadConfirmed(){const {data,error}=await sb.rpc("joygo_confirmed_players",{p_tournament_code:CODE});const box=$("confirmed");if(error){box.innerHTML='<div class="small">正式名單將於資料庫設定完成後顯示。</div>';return}const arr=data||[];box.innerHTML=arr.length?arr.map((p,i)=>`<div class="player"><b>${i+1}. ${esc(p.real_name)}</b><div class="small">${esc(p.rank||"")}${p.go_account?"｜"+esc(p.go_account):""}</div></div>`).join(""):'<div class="small">目前尚無核准選手。</div>';if(eventInfo)$("slots").textContent=`${arr.length} / ${eventInfo.max_players} 人`}
$("submit").onclick=async()=>{if(!session){msg("請先登入會員。","bad");return}const free=Number(eventInfo?.entry_fee||0)===0;const last5=free?"00000":$("last5").value.trim();if(!free&&!/^\d{5}$/.test(last5)){msg("匯款後五碼請填 5 位數字。","bad");return}if(!$("agree").checked){msg("請先勾選同意比賽規章。","bad");return}$("submit").disabled=true;msg("正在送出報名資料…");try{const {error}=await sb.rpc("joygo_submit_tournament_registration",{p_tournament_code:CODE,p_real_name:$("realName").value.trim(),p_phone:$("phone").value.trim(),p_rank:$("rank").value.trim(),p_go_account:$("goAccount").value.trim(),p_payment_last5:last5,p_rules_agreed:true});if(error)throw error;msg(free?"✅ 免費比賽報名資料已送出。待管理員確認身分後即可核准。":"✅ 報名資料已送出。待管理員確認身分與報名費後，才會取得正式參賽資格。","good");await Promise.all([loadMine(),loadConfirmed()])}catch(e){msg("送出失敗："+(e?.message||e),"bad")}finally{$("submit").disabled=false}};
async function init(){try{const {data,error}=await sb.auth.getSession();session=data?.session||null;if(error)throw error;if(!session){msg("請先回 Joy Go Platform 登入會員，再進入比賽報名。","bad");return}$("email").value=session.user.email||"";$("formCard").hidden=false;await loadEvent();await Promise.all([loadMine(),loadConfirmed()]);msg(Number(eventInfo?.entry_fee||0)===0?"會員身分確認完成。本場免費，請填寫報名資料。":"會員身分確認完成。請填寫報名資料與匯款後五碼。","good")}catch(e){msg("系統讀取失敗："+(e?.message||e),"bad")}}init();
</script></body></html>
