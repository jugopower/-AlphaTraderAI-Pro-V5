name: Deploy Joy Go Admin Reset Password

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/joygo-admin-reset-password/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy admin reset password function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy joygo-admin-reset-password --project-ref kpwfkmkxtrwmlxhomaxy
