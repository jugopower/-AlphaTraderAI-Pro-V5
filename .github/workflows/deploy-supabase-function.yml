name: Deploy Supabase Edge Function

on:

  push:

    branches:

      - main

    paths:

      - "supabase/functions/joygo-send-activity-email/**"

  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Setup Supabase CLI

        uses: supabase/setup-cli@v1

        with:

          version: latest

      - name: Check Supabase settings

        env:

          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

        run: |

          test -n "$SUPABASE_PROJECT_REF" || { echo "SUPABASE_PROJECT_REF is empty"; exit 1; }

          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is empty"; exit 1; }

          echo "Supabase settings are present."

      - name: Deploy Edge Function

        env:

          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

        run: |

          supabase functions deploy joygo-send-activity-email --project-ref "$SUPABASE_PROJECT_REF"
