<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joy Go 兒童圍棋冒險王國 Beta 1.0</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:#eaf5fb;color:#17344c}.app{max-width:660px;margin:auto;padding:18px}.hero{background:linear-gradient(130deg,#134969,#327fa2);color:white;border-radius:22px;padding:22px}.hero h1{margin:8px 0}.stats{display:flex;justify-content:space-between;gap:12px}.chip{background:#ffffff22;padding:9px 13px;border-radius:20px}.panel{background:white;border-radius:20px;margin-top:16px;padding:18px;box-shadow:0 5px 18px #2342  }.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:1px solid #d7e6ef;background:#f5fbff;border-radius:16px;padding:17px 8px;font-size:16px;cursor:pointer}.tile span{display:block;font-size:35px;margin-bottom:7px}.btn{border:0;border-radius:12px;background:#1374b1;color:white;font-size:16px;padding:12px 18px;cursor:pointer}.btn:disabled{background:#aabac4;cursor:default}.secondary{background:#f3a827;color:#2c240c}.muted{color:#60798a;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e9eff2}.row:last-child{border:0}.tabs{display:flex;gap:6px;margin-top:16px}.tabs button{flex:1;border:0;border-radius:12px;padding:12px 5px;background:white;color:#345;cursor:pointer}.tabs button.active{background:#185e84;color:white}.hidden{display:none}.question{font-size:20px;font-weight:700;margin:12px 0}.choices{display:grid;gap:8px}.choices button{padding:12px;border-radius:10px;border:1px solid #b7d3e4;background:white;text-align:left;font-size:16px}.note{font-size:13px;color:#567;margin-top:14px;line-height:1.6}.toast{min-height:24px;color:#147c52;font-weight:700;margin-top:8px}progress{width:100%;height:14px}footer{text-align:center;font-size:12px;color:#667;padding:20px}</style></head><body><main class="app"><header class="hero"><div>JOY GO PLATFORM · 兒童專區</div><h1>🐼 圍棋冒險王國</h1><div class="stats"><div class="chip">🪙 <b id="coins">350</b> 金幣</div><div class="chip">⭐ <b id="xp">130</b> XP</div></div><p>小棋士 Lv.<b id="level">2</b>　<span id="rank">白銀小棋士</span></p><progress id="progress" value="130" max="300"></progress></header><nav class="tabs"><button class="active" data-tab="home">冒險首頁</button><button data-tab="shop">金幣商店</button><button data-tab="history">任務紀錄</button></nav><section id="home" class="panel"><h2>今日冒險</h2><div class="grid"><button class="tile" onclick="show('match')"><span>⚫</span>模擬真人對弈</button><button class="tile" onclick="show('puzzle')"><span>🧩</span>每日圍棋闖關</button><button class="tile" onclick="show('shop')"><span>🎁</span>金幣商店</button><button class="tile" onclick="show('history')"><span>📜</span>獎勵紀錄</button></div><div class="panel" style="background:#f5fbff"><h3>🎁 每日登入寶箱</h3><p>首次開啟 +10 金幣、+5 XP</p><button class="btn secondary" id="daily" onclick="claimDaily()">領取今日寶箱</button></div><p class="note">目前為獨立示範版，金幣存在此瀏覽器，不會影響正式會員帳號。</p></section><section id="match" class="panel hidden"><h2>⚫ 模擬對局獎勵</h2><p>示範對局完成後獲得金幣；正式版必須由伺服器驗證真實棋局。</p><p id="matchCount" class="muted"></p><button class="btn" onclick="completeMatch(false)">模擬完成對局 (+10)</button> <button class="btn secondary" onclick="completeMatch(true)">模擬獲勝 (+15)</button><div class="toast" id="matchMsg"></div></section><section id="puzzle" class="panel hidden"><h2>🧩 每日圍棋題</h2><p class="muted" id="puzzleCount"></p><div class="question" id="question"></div><div id="choices" class="choices"></div><div class="toast" id="puzzleMsg"></div><button class="btn" onclick="nextQuestion()">換一題</button></section><section id="shop" class="panel hidden"><h2>🎁 金幣商店</h2><div id="products"></div><p class="note">本版僅模擬兌換，不產生真實訂單或實體獎品寄送。</p></section><section id="history" class="panel hidden"><h2>📜 金幣紀錄</h2><div id="records"></div><button class="btn" onclick="resetDemo()">重設本機示範資料</button></section><p id="message" class="toast" role="status"></p><footer>Joy Go Platform · Kids Beta 1.0 · 獨立離線展示版</footer></main><script>
const KEY='joygo-kids-demo-v1',day=()=>new Date().toLocaleDateString('en-CA');const initial=()=>({coins:350,xp:130,lastDay:'',matches:0,puzzles:0,matchDay:'',puzzleDay:'',records:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()};const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function add(coins,xp,why){data.coins+=coins;data.xp+=xp;data.records.unshift({when:new Date().toLocaleString('zh-TW'),why,coins,xp});data.records=data.records.slice(0,60);save()}function syncDay(){if(data.matchDay!==day()){data.matches=0;data.matchDay=day()}if(data.puzzleDay!==day()){data.puzzles=0;data.puzzleDay=day()}}function render(){syncDay();$('coins').textContent=data.coins;$('xp').textContent=data.xp;let levels=[0,100,300,800,1500],names=['青銅小棋士','白銀小棋士','黃金小棋士','鑽石小棋士','圍棋冒險王'];let idx=levels.reduce((a,x,i)=>data.xp>=x?i:a,0);$('level').textContent=idx+1;$('rank').textContent=names[idx];$('progress').max=levels[Math.min(idx+1,4)]||1500;$('progress').value=Math.min(data.xp,Number($('progress').max));$('daily').disabled=data.lastDay===day();$('daily').textContent=data.lastDay===day()?'今日已領取':'領取今日寶箱';$('matchCount').textContent=`今日已領 ${data.matches}/3 局獎勵`;$('puzzleCount').textContent=`今日已領 ${data.puzzles}/10 題獎勵`;$('records').innerHTML=data.records.length?data.records.map(r=>`<div class="row"><span>${escapeHtml(r.why)}<br><small class="muted">${escapeHtml(r.when)}</small></span><b>${r.coins>=0?'+':''}${r.coins} 🪙</b></div>`).join(''):'尚無紀錄';$('products').innerHTML=[['🐼 熊貓頭像框',100],['✏️ 文具禮包',500],['🧸 小玩偶',1000],['🏆 大型玩偶',3000]].map(([n,c])=>`<div class="row"><span>${n}<br><small class="muted">${c} 金幣</small></span><button class="btn" ${data.coins<c?'disabled':''} onclick="redeem(${c},'${n}')">模擬兌換</button></div>`).join('')};function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){document.querySelectorAll('main section[id]').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='puzzle')drawQuestion();render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));function claimDaily(){if(data.lastDay===day())return;data.lastDay=day();add(10,5,'每日登入寶箱')}function completeMatch(win){syncDay();if(data.matches>=3){$('matchMsg').textContent='今日模擬對局獎勵已達上限';return}data.matches++;add(win?15:10,win?30:20,win?'模擬獲勝':'模擬完成對局');$('matchMsg').textContent='模擬獎勵已發放！'}const questions=[{q:'一顆棋子有幾口氣？（位於棋盤中央，四周皆空）',a:['2口','3口','4口'],correct:2,why:'中央單顆棋子有上下左右四口氣。'},{q:'圍棋中的「提子」是指？',a:['移動自己的棋子','拿走沒有氣的對方棋子','交換黑白棋子'],correct:1,why:'對方棋子沒有氣時即可提走。'},{q:'在棋盤角落單獨一顆棋子，通常有幾口氣？',a:['2口','3口','4口'],correct:0,why:'角落只有兩個相鄰交叉點。'}];let qi=0,answered=false;function drawQuestion(){let q=questions[qi];answered=false;$('question').textContent=q.q;$('choices').innerHTML=q.a.map((a,i)=>`<button onclick="answer(${i})">${i+1}. ${a}</button>`).join('');$('puzzleMsg').textContent=''}function nextQuestion(){qi=(qi+1)%questions.length;drawQuestion()}function answer(i){if(answered)return;answered=true;let q=questions[qi];if(i===q.correct){syncDay();if(data.puzzles<10){data.puzzles++;add(2,5,'圍棋答題正確');$('puzzleMsg').textContent='答對了！+2 金幣、+5 XP'}else $('puzzleMsg').textContent='答對了！今日獎勵已達上限'}else $('puzzleMsg').textContent='再試試！'+q.why;document.querySelectorAll('#choices button').forEach(b=>b.disabled=true)}function redeem(c,name){if(data.coins<c)return;if(!confirm(`確認模擬兌換「${name}」？將扣除 ${c} 金幣。`))return;add(-c,0,'模擬兌換 '+name);$('message').textContent='模擬兌換完成（不會寄送實體獎品）'}function resetDemo(){if(!confirm('確定清除本機示範紀錄？'))return;data=initial();save();$('message').textContent='已重設示範資料'}render();</script></body></html>
