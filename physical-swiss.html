<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Joy Go Platform｜實體瑞士制比賽管理 Beta 0.1</title>
<style>
:root{--bg:#07130f;--panel:#0d2119;--line:#315446;--text:#f7f2dc;--muted:#b8c8bf;--gold:#e8c56a;--green:#46b97b;--red:#e56b6f;--shadow:0 12px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#06110d,#0b1c15 55%,#08120e);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:16px}header,.card{background:rgba(13,33,25,.95);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}header{padding:18px}.card{padding:14px;margin-top:14px}h1{margin:0;font-size:clamp(22px,4vw,34px);color:var(--gold)}h2{margin:0 0 10px;font-size:18px;color:#ffe294}.sub,.small,label{color:var(--muted)}.sub{margin-top:6px}.badge{display:inline-block;margin-top:10px;padding:5px 10px;border:1px solid #6d6036;border-radius:999px;color:#ffe8a0;background:#2b2512}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:13px;margin:8px 0 5px}input,select,button{font:inherit}input,select{width:100%;background:#07150f;color:var(--text);border:1px solid #365d4d;border-radius:10px;padding:10px}button{border:0;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:800}.primary{background:var(--green);color:#04110b}.gold{background:var(--gold);color:#211b06}.secondary{background:#24473a;color:#eef8f1}.danger{background:#7f2e32;color:#fff}.blue{background:#2e5f8d;color:#fff}button:disabled{opacity:.45}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.kpi div{background:#0a1a14;border:1px solid #27483a;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:20px;color:var(--gold)}.status{padding:8px 10px;border-radius:10px;background:#0a1c15;border:1px solid #2a4e3e;margin-top:10px}.notice{border-left:4px solid var(--gold);padding:10px 12px;background:#182114;border-radius:8px;color:#f8edbf;margin-top:10px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #29483c;padding:8px 6px;text-align:left}th{color:#f5d879;background:#0b1d16}.result-btns{display:flex;gap:6px;flex-wrap:wrap}.result-btns button{padding:6px 8px;font-size:12px}.win{background:#3f8f61;color:#fff}.draw{background:#7a6a38;color:#fff}.roundtitle{font-size:17px;color:#ffe08a;font-weight:800;margin:6px 0 10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.kpi{grid-template-columns:1fr 1fr}}@media(max-width:520px){.row,.row2{grid-template-columns:1fr}.wrap{padding:10px}th,td{font-size:12px;padding:7px 4px}}@media print{body{background:#fff;color:#000}.no-print{display:none!important}.card,header{box-shadow:none;border:1px solid #999;background:#fff}th{color:#000;background:#eee}.sub,.small,label{color:#333}}
</style>
</head>
<body><div class="wrap">
<header><h1>🏠 Joy Go Platform｜實體瑞士制比賽管理</h1><div class="sub">現場比賽專用｜不建立網路棋局、不使用線上棋鐘</div><span class="badge">Beta 0.1a｜獨立單檔版</span></header>
<div class="grid">
<section class="card no-print"><h2>① 建立比賽</h2><div class="row2"><div><label>比賽名稱</label><input id="eventName" value="Joy Go 16人實體瑞士制"></div><div><label>參賽人數</label><select id="capacity"><option>8</option><option selected>16</option><option>32</option></select></div></div><div class="row"><div><label>輪數</label><select id="rounds"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div><label>黑棋勝負規則</label><input id="rule" value="分先，黑185勝"></div><div><label>用時</label><input id="timeRule" value="20分＋30秒×3"></div><div><label>模式</label><input value="實體賽" disabled></div></div><div class="actions"><button class="primary" onclick="newEvent()">建立／重設比賽</button><button class="secondary" onclick="saveAll()">儲存</button><button class="danger" onclick="clearStorage()">清除本機資料</button></div><div class="notice">Beta 0.1 採「主分＋對手分（SOS）」排序；同分再比勝局數、編號。</div></section>
<section class="card no-print"><h2>② 選手名單</h2><div class="row2"><div><label>姓名</label><input id="pName" placeholder="例如：朱老師"></div><div><label>棋力</label><input id="pRank" placeholder="例如：六段"></div></div><div class="actions"><button class="gold" onclick="addPlayer()">加入選手</button><button class="secondary" onclick="fillDemo()">填入測試名單</button></div><div id="playerList" style="margin-top:10px"></div></section>
</div>
<section class="card"><h2>③ 比賽控制</h2><div class="kpi"><div><b id="kPlayers">0</b><span>選手</span></div><div><b id="kRound">0</b><span>目前輪次</span></div><div><b id="kDone">0</b><span>本輪完成</span></div><div><b id="kTotal">0</b><span>總輪數</span></div></div><div class="actions no-print"><button id="pairBtn" class="primary" onclick="makeNextRound()">產生第1輪配對</button><button class="blue" onclick="window.print()">列印目前畫面</button><button class="secondary" onclick="exportCSV()">匯出排名 CSV</button></div><div class="status" id="status">尚未建立比賽。</div></section>
<section class="card"><h2>④ 本輪配對／輸入成績</h2><div id="roundArea"><div class="small">尚未產生配對。</div></div></section>
<section class="card"><h2>⑤ 即時排名</h2><div id="standings"><div class="small">尚無排名資料。</div></div></section>
</div>
<script>
const $=id=>document.getElementById(id);let S={name:"",capacity:16,totalRounds:4,rule:"分先，黑185勝",timeRule:"20分＋30秒×3",players:[],rounds:[]};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function saveAll(){localStorage.setItem("joygo_physical_swiss_beta01",JSON.stringify(S));render();$('status').textContent="已儲存在本機瀏覽器。"}
function loadAll(){try{const x=JSON.parse(localStorage.getItem("joygo_physical_swiss_beta01")||"null");if(x)S=x}catch(e){}$('eventName').value=S.name||"Joy Go 16人實體瑞士制";$('capacity').value=String(S.capacity||16);$('rounds').value=String(S.totalRounds||4);$('rule').value=S.rule||"分先，黑185勝";$('timeRule').value=S.timeRule||"20分＋30秒×3";render()}
function newEvent(){if((S.players.length||S.rounds.length)&&!confirm("建立新比賽會清除目前名單與配對，確定嗎？"))return;S={name:$('eventName').value.trim()||"未命名比賽",capacity:+$('capacity').value,totalRounds:+$('rounds').value,rule:$('rule').value.trim(),timeRule:$('timeRule').value.trim(),players:[],rounds:[]};saveAll();$('status').textContent="比賽已建立，請輸入選手名單。"}
function clearStorage(){if(!confirm("確定清除這台裝置上的實體瑞士制資料？"))return;localStorage.removeItem("joygo_physical_swiss_beta01");location.reload()}
function addPlayer(){const name=$('pName').value.trim(),rank=$('pRank').value.trim();if(!name)return alert("請輸入姓名");if(S.players.length>=S.capacity)return alert("已達參賽人數上限");if(S.rounds.length)return alert("已開始配對，不能再新增選手");if(S.players.some(p=>p.name===name))return alert("姓名重複");S.players.push({id:uid(),no:S.players.length+1,name,rank,score:0,wins:0,bye:false});$('pName').value="";$('pRank').value="";saveAll()}
function removePlayer(id){if(S.rounds.length)return alert("已開始配對，不能刪除選手");S.players=S.players.filter(p=>p.id!==id).map((p,i)=>({...p,no:i+1}));saveAll()}
function fillDemo(){if(S.players.length||S.rounds.length)return alert("請先清空目前資料");const ranks=["七段","六段","六段","六段","五段","五段","五段","五段","四段","四段","四段","四段","三段","三段","三段","三段"];for(let i=0;i<S.capacity;i++)S.players.push({id:uid(),no:i+1,name:`選手${String(i+1).padStart(2,"0")}`,rank:ranks[i%ranks.length],score:0,wins:0,bye:false});saveAll()}
function playerById(id){return S.players.find(p=>p.id===id)}function opponentsOf(pid){const set=new Set();S.rounds.forEach(r=>r.matches.forEach(m=>{if(m.black===pid&&m.white)set.add(m.white);if(m.white===pid&&m.black)set.add(m.black)}));return set}
function standingsData(){const oppScores={};S.players.forEach(p=>{let sos=0;S.rounds.forEach(r=>r.matches.forEach(m=>{if(!m.result)return;if(m.black===p.id&&m.white)sos+=(playerById(m.white)?.score||0);else if(m.white===p.id&&m.black)sos+=(playerById(m.black)?.score||0)}));oppScores[p.id]=sos});return [...S.players].map(p=>({...p,sos:oppScores[p.id]||0})).sort((a,b)=>b.score-a.score||b.sos-a.sos||b.wins-a.wins||a.no-b.no)}
function makeNextRound(){if(!S.players.length)return alert("請先輸入選手名單");if(S.players.length!==S.capacity&&!confirm(`目前只有 ${S.players.length}/${S.capacity} 人，仍要開始嗎？`))return;if(S.rounds.length>=S.totalRounds)return alert("已完成設定的總輪數");if(S.rounds.length&&!S.rounds.at(-1).matches.every(m=>m.result))return alert("上一輪尚有未輸入的成績");const roundNo=S.rounds.length+1;let list=roundNo===1?[...S.players].sort((a,b)=>a.no-b.no):standingsData();const matches=[];if(list.length%2===1){let bye=[...list].reverse().find(p=>!p.bye)||list[list.length-1];list=list.filter(p=>p.id!==bye.id);matches.push({board:0,black:bye.id,white:null,result:"B",bye:true});const pp=playerById(bye.id);pp.score+=1;pp.wins+=1;pp.bye=true}let board=1;while(list.length){const a=list.shift(),opps=opponentsOf(a.id);let idx=list.findIndex(b=>!opps.has(b.id));if(idx<0)idx=0;const b=list.splice(idx,1)[0];const black=roundNo%2===1?a:b,white=roundNo%2===1?b:a;matches.push({board:board++,black:black.id,white:white.id,result:null,bye:false})}S.rounds.push({round:roundNo,matches});saveAll();$('status').textContent=`第 ${roundNo} 輪配對已產生。請現場下棋後輸入各桌勝負。`}
function setResult(ri,mi,res){const m=S.rounds[ri].matches[mi];if(m.bye)return;const B=playerById(m.black),W=playerById(m.white);if(m.result==="B"){B.score-=1;B.wins-=1}if(m.result==="W"){W.score-=1;W.wins-=1}if(m.result==="D"){B.score-=.5;W.score-=.5}m.result=res;if(res==="B"){B.score+=1;B.wins+=1}if(res==="W"){W.score+=1;W.wins+=1}if(res==="D"){B.score+=.5;W.score+=.5}saveAll()}
function renderPlayers(){if(!S.players.length){$('playerList').innerHTML='<div class="small">尚未輸入選手。</div>';return}$('playerList').innerHTML='<table><thead><tr><th>#</th><th>姓名</th><th>棋力</th><th class="no-print"></th></tr></thead><tbody>'+S.players.map(p=>`<tr><td>${p.no}</td><td>${esc(p.name)}</td><td>${esc(p.rank)}</td><td class="no-print"><button class="danger" onclick="removePlayer('${p.id}')">刪除</button></td></tr>`).join('')+'</tbody></table>'}
function renderRound(){if(!S.rounds.length){$('roundArea').innerHTML='<div class="small">尚未產生配對。</div>';return}const ri=S.rounds.length-1,r=S.rounds[ri];let visible=0;const rows=r.matches.map((m,mi)=>{if(m.bye)return'';const B=playerById(m.black),W=playerById(m.white);const rs=m.result==="B"?"黑勝":m.result==="W"?"白勝":m.result==="D"?"和棋":"未輸入";visible++;return `<tr><td>${m.board}</td><td>⚫ ${esc(B?.name)} ${esc(B?.rank)}</td><td>⚪ ${esc(W?.name)} ${esc(W?.rank)}</td><td><b>${rs}</b></td><td class="no-print"><div class="result-btns"><button class="win" onclick="setResult(${ri},${mi},'B')">黑勝</button><button class="win" onclick="setResult(${ri},${mi},'W')">白勝</button><button class="draw" onclick="setResult(${ri},${mi},'D')">和棋</button></div></td></tr>`}).join('');const bye=r.matches.find(m=>m.bye);$('roundArea').innerHTML=`<div class="roundtitle">第 ${r.round} 輪｜${esc(S.rule)}｜${esc(S.timeRule)}</div><table><thead><tr><th>桌次</th><th>黑方</th><th>白方</th><th>結果</th><th class="no-print">輸入</th></tr></thead><tbody>${rows}</tbody></table>${bye?`<div class="notice">輪空：${esc(playerById(bye.black)?.name)}（自動記 1 勝）</div>`:''}`}
function renderStandings(){if(!S.players.length){$('standings').innerHTML='<div class="small">尚無排名資料。</div>';return}const a=standingsData();$('standings').innerHTML='<table><thead><tr><th>名次</th><th>姓名</th><th>棋力</th><th>主分</th><th>對手分</th><th>勝局</th></tr></thead><tbody>'+a.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.rank)}</td><td><b>${p.score}</b></td><td>${p.sos}</td><td>${p.wins}</td></tr>`).join('')+'</tbody></table>'}
function render(){renderPlayers();renderRound();renderStandings();$('kPlayers').textContent=S.players.length;$('kRound').textContent=S.rounds.length;$('kTotal').textContent=S.totalRounds||0;const last=S.rounds.at(-1);$('kDone').textContent=last?last.matches.filter(m=>m.result).length:0;$('pairBtn').textContent=S.rounds.length?`產生第 ${S.rounds.length+1} 輪配對`:"產生第1輪配對";$('pairBtn').disabled=S.rounds.length>=S.totalRounds}
function exportCSV(){const a=standingsData();let csv='\uFEFF名次,姓名,棋力,主分,對手分,勝局\n';a.forEach((p,i)=>csv+=`${i+1},"${p.name.replaceAll('"','""')}","${p.rank.replaceAll('"','""')}",${p.score},${p.sos},${p.wins}\n`);const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),t=document.createElement('a');t.href=url;t.download=(S.name||'JoyGo實體瑞士制')+'-排名.csv';t.click();URL.revokeObjectURL(url)}
loadAll();
</script></body></html>
