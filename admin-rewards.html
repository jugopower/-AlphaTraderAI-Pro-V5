<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joy Go 獎勵管理 Beta 1.0d</title>
<style>body{margin:0;background:#eee8dc;color:#33291f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top,.card{background:#faf7f0;border:1px solid #d7c9b5;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #5a463018}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:1px solid #9d815f;background:#fffaf1;color:#493725;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.gold{background:#8c6b42;color:white}.bad{color:#9b3d35}.ok{color:#397249}.muted{color:#786b5c;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}input,select{font-size:16px;padding:10px;border:1px solid #cdbb9f;border-radius:10px;background:#fffdf8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}#page{display:none}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="top"><div><h1>⚙️ Joy Go 獎勵管理 <small>Beta 1.0d</small></h1><div class="muted">僅 Joy Go 管理員可使用</div></div><a class="btn" href="rewards.html">返回獎勵中心</a></div><div id="gate" class="card">正在確認管理員權限…</div><div id="page"><div class="card"><h2>🎮 對局獎勵設定</h2><div class="grid"><label class="field">自動對局獎勵<select id="enabled"><option value="true">開啟</option><option value="false">關閉</option></select></label><label class="field">每局 Joy 點<input id="perGame" type="number" min="0"></label><label class="field">最低有效手數<input id="minMoves" type="number" min="0"></label><label class="field">每日點數上限<input id="dailyLimit" type="number" min="0"></label></div><div class="actions"><button class="btn gold" onclick="saveSettings()">儲存設定</button></div></div><div class="card"><h2>👤 會員手動加／扣 Joy 點</h2><div class="grid"><label class="field">選擇會員<select id="member"><option value="">載入會員中…</option></select></label><label class="field">調整點數<input id="points" type="number" placeholder="例如 100 或 -50"></label></div><label class="field" style="margin-top:12px">原因<input id="reason" placeholder="例如：活動獎勵、資料修正"></label><div class="actions"><button class="btn gold" onclick="adjustPoints()">確認加／扣點</button></div><div class="muted">正數為加點，負數為扣點；每次調整都會寫入點數紀錄。</div></div><div id="msg" class="card muted"></div></div></div>
<script>
const CFG={url:'https://kpwfkmkxtrwmlxhomaxy.supabase.co',key:'sb_publishable_0Dryz0sA-BS7Hw28vUb0oA_06N9hWqr'};
function getCfg(){try{const c=JSON.parse(localStorage.getItem('joygo-member-supabase-v1')||'{}');return {url:c.url||c.supabaseUrl||CFG.url,key:c.key||c.anonKey||c.supabaseAnonKey||CFG.key}}catch{return CFG}}
const c=getCfg(),sb=supabase.createClient(c.url,c.key),$=id=>document.getElementById(id);
function message(s,bad=false){$('msg').className='card '+(bad?'bad':'ok');$('msg').textContent=s}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){$('gate').innerHTML='<span class="bad">請先登入 Joy Go Platform。</span>';return}const {data:isAdmin,error}=await sb.rpc('is_joygo_admin');if(error){$('gate').innerHTML='<span class="bad">管理員權限檢查失敗：'+error.message+'</span>';return}if(!isAdmin){$('gate').innerHTML='<span class="bad">此頁僅限 Joy Go 管理員使用。</span>';return}$('gate').style.display='none';$('page').style.display='block';await Promise.all([loadSettings(),loadMembers()])}
async function loadSettings(){const {data,error}=await sb.from('joygo_points_settings').select('*').limit(1).maybeSingle();if(error)return message('設定讀取失敗：'+error.message,true);if(!data)return message('找不到 Joy 點設定資料。',true);$('enabled').value=String(data.game_reward_enabled);$('perGame').value=data.points_per_game;$('minMoves').value=data.min_moves;$('dailyLimit').value=data.daily_points_limit;message('設定已載入。')}
async function saveSettings(){const args={p_game_reward_enabled:$('enabled').value==='true',p_points_per_game:Number($('perGame').value),p_min_moves:Number($('minMoves').value),p_daily_points_limit:Number($('dailyLimit').value)};const {error}=await sb.rpc('joygo_admin_update_points_settings',args);if(error)return message('儲存失敗：'+error.message,true);message('✅ Joy 點設定已儲存。')}
async function loadMembers(){const {data,error}=await sb.from('profiles').select('id,display_name,email').order('display_name',{ascending:true});if(error){$('member').innerHTML='<option value="">會員載入失敗</option>';return message('會員名單讀取失敗：'+error.message,true)}$('member').innerHTML='<option value="">請選擇會員</option>'+(data||[]).map(x=>`<option value="${x.id}">${esc(x.display_name||'未命名')}｜${esc(x.email||'無 Email')}</option>`).join('')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function adjustPoints(){const uid=$('member').value,pts=Number($('points').value),reason=$('reason').value.trim()||'管理員調整';if(!uid)return message('請先選擇會員。',true);if(!Number.isInteger(pts)||pts===0)return message('點數必須是非 0 的整數。',true);const label=$('member').options[$('member').selectedIndex].text;if(!confirm(`確定為「${label}」調整 ${pts>0?'+':''}${pts} Joy 點？`))return;const {error}=await sb.rpc('joygo_admin_adjust_points',{p_user_id:uid,p_points:pts,p_reason:reason});if(error)return message('調整失敗：'+error.message,true);message(`✅ ${label} 已調整 ${pts>0?'+':''}${pts} Joy 點。`);$('points').value='';$('reason').value=''}
init();</script></body></html>
