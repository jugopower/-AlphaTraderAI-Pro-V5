<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#22180f" />
  <title>Joy Go Platform V1.0｜朱老師圍棋教學平台</title>
  <style>
    :root{
      --gold:#d8b168;
      --gold2:#f0d49d;
      --ink:#20150e;
      --cream:#fff4d9;
      --glass:rgba(24,16,10,.72);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#1a120c;color:#fff}
    body{min-height:100svh;overflow-x:hidden}
    .page{
      min-height:100svh;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        linear-gradient(rgba(12,8,5,.20),rgba(12,8,5,.32)),
        url('hero.png') center/cover no-repeat;
    }
    .shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.05),rgba(0,0,0,.32) 75%);pointer-events:none}
    .panel{
      position:relative;
      width:min(760px,94vw);
      margin-top:38vh;
      padding:18px 18px 16px;
      border:1px solid rgba(229,195,125,.42);
      border-radius:22px;
      background:linear-gradient(180deg,rgba(35,23,14,.78),rgba(19,12,8,.86));
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 18px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .label{font-size:15px;letter-spacing:.12em;color:#f4dfb7;text-align:center;margin-bottom:10px}
    .row{display:flex;gap:10px;align-items:center}
    input{
      flex:1;min-width:0;height:54px;border-radius:14px;border:1px solid rgba(228,192,116,.55);
      background:rgba(255,248,232,.95);color:#2b1c11;font-size:20px;font-weight:700;letter-spacing:.12em;
      padding:0 16px;outline:none;text-align:center;text-transform:uppercase;
      box-shadow:inset 0 1px 2px rgba(0,0,0,.06)
    }
    input:focus{border-color:#f0cf8a;box-shadow:0 0 0 3px rgba(240,207,138,.18)}
    button{
      height:54px;border:0;border-radius:14px;padding:0 24px;cursor:pointer;
      background:linear-gradient(180deg,#f5d994,#d5aa5e);color:#3b260f;font-weight:800;font-size:19px;
      box-shadow:0 8px 22px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.55)
    }
    button:active{transform:translateY(1px)}
    .hint{min-height:24px;margin-top:10px;text-align:center;color:#f0d9aa;font-size:14px}
    .footer{margin-top:3px;text-align:center;color:rgba(255,240,208,.72);font-size:12px;letter-spacing:.06em}
    @media (max-width:680px){
      .page{padding:14px;background-position:center top}
      .panel{margin-top:46vh;padding:15px;border-radius:18px}
      .row{flex-direction:column}
      input,button{width:100%;height:52px}
      button{font-size:18px}
    }
    @media (orientation:landscape) and (max-height:650px){
      .page{align-items:flex-end;padding-bottom:16px;background-position:center 38%}
      .panel{margin-top:0;width:min(820px,92vw);padding:12px 14px}
      .row{flex-direction:row}
      input,button{height:46px}
      .label{margin-bottom:7px}.hint{margin-top:7px;min-height:20px}.footer{display:none}
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Joy Go Platform 入口">
    <div class="shade"></div>
    <section class="panel">
      <div class="label">平台通行碼</div>
      <div class="row">
        <input id="passcode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="請輸入 JOYGOI0" aria-label="平台通行碼" />
        <button id="enterBtn" type="button">進入平台</button>
      </div>
      <div id="msg" class="hint">打造專屬於棋友全方位圍棋空間</div>
      <div class="footer">Joy Go Platform V1.0</div>
    </section>
  </main>

  <script>
    const PASSCODE = 'JOYGOI0';
    const TARGET = 'https://jugopower.github.io/-AlphaTraderAI-Pro-V5/';
    const input = document.getElementById('passcode');
    const btn = document.getElementById('enterBtn');
    const msg = document.getElementById('msg');

    function enterPlatform(){
      const value = input.value.trim().toUpperCase();
      if(value === PASSCODE){
        msg.textContent = '通行碼正確，正在進入平台…';
        sessionStorage.setItem('joygo-entry-ok','1');
        window.location.href = TARGET;
      } else {
        msg.textContent = '通行碼不正確，請重新輸入。';
        input.focus();
        input.select();
      }
    }

    btn.addEventListener('click', enterPlatform);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') enterPlatform(); });
  </script>
</body>
</html>
