<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b120c" />
  <title>Joy Go Platform V1.0｜朱老師圍棋教學平台</title>
  <style>
    :root{
      --gold:#e3bf79;
      --gold-strong:#f2d798;
      --gold-deep:#af8243;
      --cream:#fff5df;
      --ink:#2a1b10;
      --glass:rgba(22,14,9,.52);
      --glass-line:rgba(236,197,120,.34);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#120c08;color:#fff}
    body{min-height:100svh;overflow:hidden}
    .page{
      min-height:100svh;
      position:relative;
      background:
        linear-gradient(rgba(8,5,3,.18), rgba(8,5,3,.34)),
        url('hero.png') center/cover no-repeat;
    }
    .shade{
      position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at 50% 38%, rgba(0,0,0,.05) 0%, rgba(0,0,0,.16) 52%, rgba(0,0,0,.28) 100%);
    }
    .gate-wrap{
      position:absolute;
      left:50%; bottom:max(30px, env(safe-area-inset-bottom) + 14px);
      transform:translateX(-50%);
      width:min(520px, calc(100vw - 28px));
      z-index:2;
    }
    .gate{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border-radius:999px;
      background:linear-gradient(180deg, rgba(34,22,14,.72), rgba(18,12,8,.82));
      border:1px solid var(--glass-line);
      box-shadow:0 12px 32px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .label{
      flex:0 0 auto;
      display:inline-flex; align-items:center; gap:8px;
      color:#f3dbad; font-size:15px; font-weight:700; letter-spacing:.04em;
      padding-left:6px; white-space:nowrap;
    }
    .label .lock{font-size:18px; line-height:1}
    .input{
      flex:1 1 auto;
      min-width:0; height:42px;
      border-radius:999px; border:1px solid rgba(230,196,123,.48);
      background:rgba(255,249,239,.94);
      color:var(--ink); font-size:19px; font-weight:800; letter-spacing:.10em;
      text-transform:uppercase; text-align:center;
      padding:0 14px; outline:none;
      box-shadow:inset 0 1px 2px rgba(0,0,0,.08);
    }
    .input:focus{border-color:var(--gold-strong); box-shadow:0 0 0 3px rgba(241,211,147,.14)}
    .btn{
      flex:0 0 auto;
      height:42px; min-width:114px;
      border:0; border-radius:999px;
      background:linear-gradient(180deg,#f0d59b,#d4a85a);
      color:#3b260f; font-size:16px; font-weight:900;
      padding:0 18px; cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.55);
    }
    .btn:active{transform:translateY(1px)}
    .hint{
      margin-top:10px; text-align:center; min-height:20px;
      color:rgba(255,237,201,.86); font-size:13px; letter-spacing:.03em;
      text-shadow:0 1px 2px rgba(0,0,0,.35);
    }
    .footer{
      margin-top:7px; text-align:center; font-size:12px; color:rgba(255,240,207,.76);
      text-shadow:0 1px 2px rgba(0,0,0,.3);
    }

    @media (max-width:720px){
      .gate-wrap{bottom:max(18px, env(safe-area-inset-bottom) + 10px); width:min(94vw, 520px)}
      .gate{padding:10px; gap:8px; display:grid; grid-template-columns:1fr auto; border-radius:20px}
      .label{grid-column:1 / -1; justify-content:center; padding-left:0; font-size:14px}
      .input{height:40px; font-size:18px; letter-spacing:.08em}
      .btn{height:40px; min-width:96px; font-size:15px; padding:0 14px}
      .hint{margin-top:8px; font-size:12px}
      .footer{margin-top:5px}
    }

    @media (orientation:landscape) and (max-height:640px){
      .gate-wrap{bottom:12px; width:min(560px, calc(100vw - 24px));}
      .gate{padding:8px 10px}
      .label{font-size:14px}
      .input,.btn{height:38px}
      .input{font-size:17px}
      .btn{font-size:15px; min-width:96px}
      .hint,.footer{display:none}
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Joy Go Platform 入口頁">
    <div class="shade"></div>

    <div class="gate-wrap">
      <div class="gate">
        <div class="label"><span class="lock">🔒</span><span>平台通行碼</span></div>
        <input id="passcode" class="input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="JOYGOI0" aria-label="平台通行碼" />
        <button id="enterBtn" class="btn" type="button">進入平台</button>
      </div>
      <div id="msg" class="hint">打造專屬於棋友全方位圍棋空間</div>
      <div class="footer">Joy Go Platform V1.0</div>
    </div>
  </main>

  <script>
    const PASSCODE = 'JOYGOI0';
    const TARGET = 'platform.html';
    const input = document.getElementById('passcode');
    const btn = document.getElementById('enterBtn');
    const msg = document.getElementById('msg');

    function enterPlatform(){
      const value = input.value.trim().toUpperCase();
      if(value === PASSCODE){
        msg.textContent = '通行碼正確，正在進入平台…';
        sessionStorage.setItem('joygo-entry-ok','1');
        window.location.href = TARGET;
      } else {
        msg.textContent = '通行碼不正確，請重新輸入。';
        input.focus();
        input.select();
      }
    }

    btn.addEventListener('click', enterPlatform);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter') enterPlatform();
    });
  </script>
</body>
</html>
