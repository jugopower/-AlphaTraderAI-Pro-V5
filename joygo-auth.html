<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>會員中心｜Joy Go Platform</title>
  <style>
    :root{color-scheme:light;--ink:#173b38;--jade:#317a6e;--gold:#d7ad54;--paper:#f6f1e7;--danger:#a73535}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#d9efe8,transparent 38%),linear-gradient(145deg,#f9f4e9,#dfece6)}main{width:min(470px,100%);background:#fffdf8;border:1px solid #d8d0c0;border-radius:28px;padding:30px;box-shadow:0 22px 60px #24443b26}.brand{text-align:center}.stone{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#183d38;color:#fff;font-size:25px;box-shadow:inset -8px -8px 14px #071a17aa}.brand h1{margin:12px 0 2px;font-size:28px}.brand p{margin:0 0 22px;color:#65807b}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e8eee9;border-radius:13px;padding:4px}.tabs button{border:0;border-radius:10px;padding:11px;background:transparent;color:var(--ink);font-weight:750}.tabs button.active{background:white;box-shadow:0 3px 10px #24443b1c}label{display:block;margin-top:16px;font-weight:700}input{width:100%;margin-top:7px;padding:13px 14px;border:1px solid #b9c9c4;border-radius:12px;font-size:16px;background:white}input:focus{outline:3px solid #77b6a744;border-color:var(--jade)}button.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--jade),#215f56);color:white;font-size:17px;font-weight:800}button:disabled{opacity:.55}.message{min-height:22px;margin:13px 0 0;text-align:center;font-size:14px}.message.error{color:var(--danger)}.message.success{color:#1b7144}.message.notice{color:#876211}.account{text-align:center;padding:15px 0}.account h2{margin-bottom:4px}.account p{color:#607a75}.secondary,.guest{display:block;width:100%;padding:12px;border-radius:12px;text-align:center;font-weight:750;text-decoration:none}.secondary{border:1px solid #b8c9c4;background:white;color:var(--ink)}.guest{margin-top:10px;background:#efe4c9;color:#63491d}.privacy{margin:17px 0 0;font-size:12px;color:#71847f;text-align:center}
  </style>
</head>
<body><main>
  <div class="brand"><span class="stone">碁</span><h1>Joy Go 會員中心</h1><p>快樂學圍棋，記錄每一步成長</p></div>
  <form id="authForm">
    <div class="tabs"><button type="button" class="active" data-mode="login">會員登入</button><button type="button" data-mode="register">免費註冊</button></div>
    <label hidden>顯示名稱<input id="displayName" autocomplete="name" maxlength="30" placeholder="例如：朱老師"></label>
    <label>Email<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
    <label>密碼<input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="至少 8 個字元"></label>
    <button id="submitButton" class="primary" type="submit">登入</button>
  </form>
  <section id="account" class="account" hidden><h2 id="memberName">Joy Go 棋友</h2><p id="memberEmail"></p><button id="signOut" class="secondary" type="button">登出</button></section>
  <p id="message" class="message" aria-live="polite"></p>
  <a class="guest" href="./index.html">訪客直接試玩</a>
  <p class="privacy">會員資料由安全登入服務保存；Joy Go 不會看到您的密碼。</p>
</main><script type="module" src="./joygo-auth.js"></script></body>
</html>
